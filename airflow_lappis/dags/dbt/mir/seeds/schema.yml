version: 2

seeds:
  - name: partidos_logo
    config:
      column_types:
        sigla: text
        nome: text
        logo_url: text
  - name: partidos_map
    config:
      column_types:
        sigla_origem: text
        sigla_canonica: text
  - name: uf_regiao
    description: "Unidades da federacao com nome e regiao; alimenta dim_localidade."
    config:
      column_types:
        uf: text
        nome_uf: text
        regiao: text
    columns:
      - name: uf
        tests:
          - unique
          - not_null
  - name: ugs_mir
    description: >
      Unidades gestoras do MIR. Lista explicita (decisao do usuario em
      2026-09-29): o prefixo 81 nao identifica o MIR (810012 e o Ministerio das
      Mulheres) e a Setorial Financeira do MIR e a 238012. Usada para separar o
      lado do MIR do lado executor nas NCs e PFs de TED e para descartar as NCs
      internas (MIR para MIR).
    config:
      column_types:
        ug_codigo: text
        ug_nome: text
    columns:
      - name: ug_codigo
        tests:
          - unique
          - not_null
