name: 'mir'

version: 1.0.0
config-version: 2

profile: mir

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  # Texto (sem o código de órgão) usado para filtrar registros do PPA/SIOP que
  # pertencem ao MIR — os CSVs do PPA trazem o órgão como "67000 - Ministério
  # da Igualdade Racial", daí o ilike por trecho em vez de igualdade exata.
  orgao_mir: "Ministério da Igualdade Racial"

models:
  mir: 
    +database: "{{ env_var('DB_DW_DBNAME_MIR', 'analytics') }}"
    metadata:
      +materialized: incremental
      +schema: metadata
    emendas_dbt:
      +materialized: table
      +schema: emendas
    dados_abertos_dbt:
     +materialized: table
     +schema: dados_abertos
    empenhos_ted_dbt:
     +materialized: table
     +schema: siafi_dbt
    siconv_dbt:
      +materialized: table
      +schema: siconv_dbt
    ppa_dbt:
      +materialized: table
      +schema: ppa_dbt
    contratos_dbt:
      +materialized: table
      +schema: contratos_dbt
    mir_silver:
      +materialized: table
      +schema: mir_silver
    coleta_mir:
      +materialized: table
      +schema: coleta_mir
      # Leitor do Coleta MIR (usuario somente leitura da sincronizacao diaria).
      # Passe o papel em --vars '{coleta_mir_leitor: <papel>}' (ou em vars:)
      # para dar select nas tabelas do schema; sem a var, nenhum grant e feito.
      # O papel tambem precisa de USAGE no schema coleta_mir (fora do dbt).
      +grants:
        select: "{{ [var('coleta_mir_leitor')] if var('coleta_mir_leitor', none) else [] }}"



on-run-start:
  - '{{create_udfs()}}'