version: 2

models:
  - name: coleta_instrumento
    description: >
      Contrato de dados do Coleta MIR: um registro por instrumento do MIR (TED,
      tedinho, convenio, termo de fomento), com os campos preenchidos
      automaticamente nos formularios (Bloco 1) e o identificador do parceiro
      usado no controle de acesso (CNPJ para convenio/termo de fomento, UG para
      TED). Tedinhos so entram quando foram identificados nas paginas de
      transparencia do gov.br. Consumido pela sincronizacao diaria do Coleta
      MIR: mudar nome ou tipo de coluna quebra o consumidor.
    columns:
      - name: chave
        description: "<tp_instrumento>:<nr_instrumento>. Chave estavel do contrato."
        tests:
          - unique
          - not_null
      - name: tp_instrumento
        tests:
          - not_null
          - accepted_values:
              values: ['ted', 'tedinho', 'convenio', 'termo_fomento']
      - name: nr_instrumento
        description: "TED: id_instrumento (num_transf canonico); tedinho: id do instrumento (nc:/proc:/transf:); convenio e termo de fomento: nr_convenio."
        tests:
          - not_null
      - name: tp_identificador
        description: "'ug' para TED/tedinho, 'cnpj' para convenio/termo de fomento; nulo quando o identificador nao foi encontrado."
        tests:
          - accepted_values:
              values: ['cnpj', 'ug']
      - name: co_identificador
        description: "Codigo da UG (6 digitos) ou CNPJ (14 digitos), so digitos. Nulo sem identificador; ver coleta_cobertura_identificador."
      - name: no_parceiro
      - name: ds_objeto
      - name: vl_firmado
      - name: vl_empenhado
      - name: vl_liquidado
      - name: vl_pago
      - name: dt_inicio_vigencia
      - name: dt_fim_vigencia
      - name: dt_assinatura
      - name: ds_situacao
      - name: nr_processo_sei
      - name: qt_aditivos
      - name: dt_ingest

  - name: coleta_cobertura_identificador
    description: >
      Quantos instrumentos do contrato tem identificador do parceiro (UG/CNPJ),
      por tipo. Instrumento sem identificador nao pode ser acessado por gestor
      no Coleta MIR ate o MIR atribuir um manualmente.
    columns:
      - name: tp_instrumento
        tests:
          - unique
          - not_null
      - name: qt_total
      - name: qt_sem_identificador
      - name: pc_cobertura

  - name: coleta_instrumento_meta
    description: >
      Metas e etapas do plano de trabalho por instrumento, para a lista do item
      5.2 dos formularios do Coleta MIR. TED: plano_acao_meta/plano_acao_etapa
      da API de TED; convenio e termo de fomento: meta_crono_fisico do SICONV
      (sem etapas). Linha da meta tem nr_etapa nulo. O municipio vem por nome
      (no_municipio), como no SICONV; o Coleta casa com o IBGE. Grao:
      (chave_instrumento, id_origem). id_origem e a chave estavel da linha na
      fonte e deve ser usada por quem consome; nr_meta e nr_etapa sao a
      numeracao da fonte e podem se repetir.
    columns:
      - name: chave_instrumento
        tests:
          - not_null
          - relationships:
              to: ref('coleta_instrumento')
              field: chave
      - name: id_origem
        description: >
          Chave estavel da linha na fonte: ted_meta:<id_meta>,
          ted_etapa:<id_etapa> ou siconv_meta:<id_meta>.
        tests:
          - not_null
          - unique
      - name: nr_meta
        tests:
          - not_null
      - name: nr_etapa
        description: Numero da etapa na fonte; pode se repetir dentro da meta.
      - name: no_meta
      - name: ds_meta
      - name: qt_meta
      - name: ds_unidade
      - name: sg_uf
      - name: no_municipio
      - name: dt_inicio
      - name: dt_fim

  - name: coleta_lista_ppa
    description: >
      Lista em cascata do PPA do MIR (revisao mais recente) para o Bloco 3.1:
      programa > objetivo especifico > indicador > meta; entrega pendurada no
      objetivo especifico; medida institucional no programa.
    columns:
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              values: ['programa', 'objetivo_especifico', 'indicador', 'meta', 'entrega', 'medida_institucional']
      - name: codigo
        tests:
          - not_null
      - name: codigo_pai
      - name: titulo
      - name: ano_ppa

  - name: coleta_lista_agenda
    description: "Agendas transversais e ODS (Blocos 3.1 e 3.2), uma linha por chave_agenda."
    columns:
      - name: codigo
        tests:
          - unique
          - not_null
      - name: nome
      - name: grupo
      - name: nome_mae

  - name: coleta_lista_pei
    description: "Planejamento Estrategico Institucional (Bloco 3.3); espelho do seed pei_mir."
    columns:
      - name: nivel
      - name: codigo
        tests:
          - not_null
      - name: codigo_pai
      - name: titulo
