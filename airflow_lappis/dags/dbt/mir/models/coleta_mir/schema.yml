version: 2

models:

  - name: coleta_ted
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para os Blocos 1 e 2 do formulário de TEDs: um registro por
      TED firmado do MIR, com os campos que o formulário preenche sozinho. Fonte: portal
      TED (planos de ação, programa e termo de execução).

      Entra todo plano de ação com número de transferência que não foi rejeitado,
      vigente ou não: o Bloco 6 (relatório de cumprimento do objeto) também vale para
      TED encerrado. A tabela é refeita a cada carga: um TED some dela quando o plano é
      rejeitado ou perde o número no portal. A ingestão do portal só insere e atualiza,
      então um plano que deixe de vir na resposta do portal continua aqui com a última
      situação conhecida.

      Lido pelo Coleta MIR: mudar o nome, o tipo ou o significado de uma coluna quebra o
      consumidor. Coluna nova é segura. As regras de id_plano_acao, cd_ted e
      nr_transferencia são constraints: um build que as viole falha antes de trocar a
      tabela, e o Coleta continua lendo a versão anterior.
    columns:
      - name: id_plano_acao
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave do contrato: o id do plano de ação no portal TED. É o que o Coleta deve
          guardar para ligar as respostas ao TED.

      - name: cd_ted
        data_type: text
        constraints:
          - type: not_null
          - type: unique
        description: >
          Número do TED no formulário: o código do programa do TED no portal, com 14
          dígitos (id do MIR no portal, 308823, mais ano e sequencial). Ex.:
          30882320220003. Enquanto o programa não chega à API de dados abertos, sai do
          código do plano no portal.

      - name: no_ted
        data_type: text
        description: >
          Nome do programa do TED, o título que o formulário mostra ao lado do número.
          Nulo enquanto o programa não chega à API de dados abertos.

      - name: nr_transferencia
        data_type: text
        constraints:
          - type: not_null
          - type: unique
        description: >
          Número da transferência no SIAFI, o que as NCs e NEs citam. Numérico até 2025
          (ex.: 930164); alfanumérico nos TEDs novos de 2026 (ex.: 7AAFAJ).

      - name: aa_instrumento
        data_type: integer
        description: "Ano da transferência."

      - name: ds_situacao_plano
        data_type: text
        description: >
          Situação do plano de ação no portal (ex.: APROVADO, ANALISE_APROVADA). O
          filtro só exclui REJEITADO; o teste avisa quando surgir outra situação.
        tests:
          - accepted_values:
              values:
                - APROVADO
                - ANALISE_APROVADA
              config:
                severity: warn

      - name: ds_situacao_termo
        data_type: text
        description: >
          Situação do termo de execução (ex.: EM_EXECUCAO, CUMPRIMENTO_OBJETO_INICIADO,
          PENDENTE_REGISTRO_NO_SIAFI). Nulo quando o termo ainda não aparece na API de
          TED.

      - name: nr_processo_sei
        data_type: text
        description: "Processo SEI de formalização do TED, do termo de execução. Nulo quando o termo não traz."

      - name: dt_assinatura
        data_type: date
        description: "Data de celebração: assinatura do primeiro termo de execução do plano."

      - name: ds_objeto
        data_type: text
        description: "Objeto do TED, como está no plano de ação."

      - name: ds_justificativa
        data_type: text
        description: "Justificativa do plano de ação (item 3.6 do formulário)."

      - name: vl_total
        data_type: numeric(15, 2)
        description: "Valor total pactuado no plano de ação, em R$."

      - name: dt_inicio_vigencia
        data_type: date
        description: "Início da vigência do plano de ação."

      - name: dt_fim_vigencia
        data_type: date
        description: "Fim da vigência do plano de ação."

      - name: sg_unidade_acompanhamento
        data_type: text
        description: >
          Sigla da unidade do MIR que acompanha o TED (Bloco 2: unidade descentralizadora
          responsável). Ex.: SEPAR, SENAPIR-MIR, SQPT; MIR quando o plano não indica uma
          secretaria.

      - name: no_unidade_acompanhamento
        data_type: text
        description: "Nome da unidade do MIR que acompanha o TED."

      - name: sg_parceiro
        data_type: text
        description: "Sigla do órgão que recebeu o crédito (unidade descentralizada), cujo gestor preenche os Blocos 4 e 5."

      - name: no_parceiro
        data_type: text
        description: "Nome do órgão que recebeu o crédito."

      - name: cd_ug_parceiro
        data_type: text
        description: "UG (código SIAFI) do órgão que recebeu o crédito, segundo o portal TED."

      - name: cd_siorg_parceiro
        data_type: text
        description: >
          Código Siorg do órgão que recebeu o crédito, do beneficiário do programa. Nulo
          quando o programa tem mais de um beneficiário.

  - name: coleta_ted_produto
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para o item 5.2 do formulário de TEDs (produtos previstos no
      plano de trabalho): uma linha por meta e uma por etapa de cada TED de coleta_ted.
      A meta é o produto pactuado; as etapas são as ações previstas dentro dela. Fonte:
      API de TED (plano_acao_meta e plano_acao_etapa).

      Se o plano de ação for refeito no portal e as metas ganharem ids novos, as linhas
      antigas somem e entram outras; quem consome deve ligar as respostas a id_origem e
      tratar a ausência como produto retirado do plano.
    columns:
      - name: id_origem
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave da linha: 'meta:' ou 'etapa:' seguido do id da meta ou da etapa na API
          de TED. É o que a resposta do Coleta deve guardar.

      - name: id_plano_acao
        data_type: integer
        constraints:
          - type: not_null
        description: "TED da linha (coleta_ted.id_plano_acao)."
        tests:
          - relationships:
              to: ref('coleta_ted')
              field: id_plano_acao

      - name: tp_nivel
        data_type: text
        description: "'meta' (produto pactuado) ou 'etapa' (ação prevista dentro da meta)."
        tests:
          - not_null
          - accepted_values:
              values: ['meta', 'etapa']

      - name: id_origem_pai
        data_type: text
        description: "Na etapa, o id_origem da meta a que ela pertence. Nulo na meta."

      - name: nr_meta
        data_type: integer
        description: "Número da meta no plano de trabalho. Na etapa, o número da meta a que ela pertence."

      - name: nr_etapa
        data_type: integer
        description: "Número da etapa dentro da meta. Nulo na meta."

      - name: no_item
        data_type: text
        description: "Nome da meta ou da etapa."

      - name: ds_item
        data_type: text
        description: "Descrição da meta ou da etapa."

      - name: ds_unidade
        data_type: text
        description: "Unidade de medida da etapa (ex.: UNIDADE). A API não traz unidade na meta."

      - name: qt_prevista
        data_type: numeric
        description: "Quantidade prevista da etapa. A API não traz quantidade na meta."

      - name: vl_unitario
        data_type: numeric
        description: "Valor unitário previsto da etapa, em R$. A API não traz valor na meta."

      - name: dt_inicio
        data_type: date
        description: "Início previsto da meta ou da etapa."

      - name: dt_fim
        data_type: date
        description: "Fim previsto da meta ou da etapa."

      - name: dt_atualizacao
        data_type: timestamptz
        description: >
          Carga mais antiga entre as fontes da linha. Herda o dt_ingest das bronzes, que
          interpretam como horário de Brasília um horário gravado em UTC (3 h adiantado).

  - name: coleta_ted_fonte
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para o item 3.5 do formulário de TEDs (programa orçamentário
      e fonte de recursos): o crédito descentralizado pelo MIR a cada TED de coleta_ted,
      uma linha por ano de emissão, programa, ação, PTRES, fonte e natureza de despesa.
      Fonte: notas de crédito do SIAFI (nc_unificado), ligadas pelo número da
      transferência que a NC traz.

      TED sem linha não quer dizer TED sem crédito. Só há NC carregada a partir de 2023:
      os TEDs de 2022 receberam crédito, mas as NCs desse ano não estão aqui. Fora 2022,
      a ausência quer dizer que ainda não houve NC (termo pendente de registro no SIAFI
      ou ainda não emitido).

      As regras do grão e de vl_liquido são constraints: um build que as viole falha
      antes de trocar a tabela, e o Coleta continua lendo a versão anterior.
    constraints:
      - type: primary_key
        columns:
          - id_plano_acao
          - aa_emissao
          - cd_programa
          - cd_acao
          - cd_ptres
          - cd_fonte
          - cd_natureza_despesa
      - type: check
        expression: >
          vl_liquido = coalesce(vl_descentralizado, 0) - coalesce(vl_anulado, 0)
          - coalesce(vl_devolvido, 0)
    columns:
      - name: id_plano_acao
        data_type: integer
        constraints:
          - type: not_null
        description: "TED da linha (coleta_ted.id_plano_acao). Parte da chave."
        tests:
          - relationships:
              to: ref('coleta_ted')
              field: id_plano_acao

      - name: aa_emissao
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano de emissão das NCs. Parte da chave."

      - name: cd_programa
        data_type: text
        constraints:
          - type: not_null
        description: "Código do programa orçamentário (ex.: 5804). Em 2023 aparecem programas do PPA 2020-2023 (ex.: 5034). Parte da chave."

      - name: no_programa
        data_type: text
        description: "Nome do programa orçamentário."

      - name: cd_acao
        data_type: text
        constraints:
          - type: not_null
        description: "Código da ação orçamentária (ex.: 21FC). Parte da chave."

      - name: no_acao
        data_type: text
        description: "Nome da ação orçamentária."

      - name: cd_uo
        data_type: text
        description: >
          Unidade orçamentária do crédito, pelo PTRES no relatório de execução do PPA
          (67101 = MIR). Nulo se o PTRES não aparece lá. Fica fora da chave porque sai
          do PTRES: se um PTRES tiver duas UOs, a linha se duplica e o build falha.

      - name: cd_ptres
        data_type: text
        constraints:
          - type: not_null
        description: "PTRES (programa de trabalho resumido) da NC. Parte da chave."

      - name: cd_fonte
        data_type: text
        constraints:
          - type: not_null
        description: "Fonte de recursos da NC. Parte da chave."

      - name: no_fonte
        data_type: text
        description: "Nome da fonte de recursos."

      - name: cd_natureza_despesa
        data_type: text
        constraints:
          - type: not_null
        description: "Natureza de despesa da NC (ex.: 339039). Parte da chave."

      - name: no_natureza_despesa
        data_type: text
        description: "Nome da natureza de despesa."

      - name: vl_descentralizado
        data_type: numeric(15, 2)
        description: "Crédito descentralizado ao TED, em R$. Nulo quando a linha só tem anulação ou devolução."

      - name: vl_anulado
        data_type: numeric(15, 2)
        description: "Anulação de descentralização feita pelo MIR, em R$ (positivo). Nulo quando não houve."

      - name: vl_devolvido
        data_type: numeric(15, 2)
        description: "Devolução de crédito feita pelo parceiro, em R$ (positivo). Nulo quando não houve."

      - name: vl_liquido
        data_type: numeric(15, 2)
        description: >
          Crédito que ficou com o TED: descentralizado menos anulado menos devolvido, em
          R$. Soma todos os eventos da NC, então um evento além dos três faz a conta não
          fechar e o build falhar.
