version: 2

models:
  - name: coleta_instrumento
    config:
      contract:
        enforced: true
    description: >
      Contrato de dados do Coleta MIR: um registro por instrumento do MIR (TED,
      tedinho, convenio, termo de fomento), com os campos preenchidos
      automaticamente nos formularios (Bloco 1) e o identificador do parceiro
      usado no controle de acesso (CNPJ para convenio/termo de fomento, UG para
      TED). Tedinhos so entram quando foram identificados nas paginas de
      transparencia do gov.br (modelo ted_tedinho_gov_br); parceiro, objeto e
      processo do tedinho vem da pagina. Consumido pela sincronizacao diaria do Coleta
      MIR: mudar nome ou tipo de coluna quebra o consumidor.
    columns:
      - name: chave
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          <tp_instrumento>:<nr_instrumento>. Chave do contrato, unica. Estavel
          para TED, convenio e termo de fomento. Para tedinho, nr_instrumento vem
          de tedinhos_mir.instrumento_key ('proc:', 'transf:' ou 'nc:') e pode
          mudar quando uma NC posterior traz o processo; use nc_referencia para
          religar o instrumento.
        tests:
          - unique
          - not_null
      - name: tp_instrumento
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['ted', 'tedinho', 'convenio', 'termo_fomento']
      - name: nr_instrumento
        data_type: text
        description: "TED: id_instrumento (num_transf canonico); tedinho: id do instrumento (nc:/proc:/transf:); convenio e termo de fomento: nr_convenio."
        tests:
          - not_null
      - name: nc_referencia
        data_type: text
        description: >
          So para tedinho: a menor NC (ordem de texto) do instrumento em
          tedinhos_mir. Nao muda quando o nr_instrumento do tedinho muda; serve
          para o consumidor religar o instrumento. Nulo para os demais tipos.
      - name: tp_identificador
        data_type: text
        description: "'ug' para TED/tedinho, 'cnpj' para convenio/termo de fomento; nulo quando o identificador nao foi encontrado."
        tests:
          - accepted_values:
              values: ['cnpj', 'ug']
      - name: co_identificador
        data_type: text
        description: >
          Codigo da UG (6 digitos) ou CNPJ (14 digitos), so digitos. Nulo sem
          identificador; ver coleta_cobertura_identificador. TED, em ordem: UG do
          plano no portal (so com 6 digitos e fora do MIR), UG que recebeu o
          credito, UG unica do empenho. Tedinho: UG favorecida das notas de
          credito. UG do MIR nunca entra.
      - name: no_parceiro
        data_type: text
      - name: ds_objeto
        data_type: text
      - name: vl_firmado
        data_type: numeric
      - name: vl_empenhado
        data_type: numeric
      - name: vl_liquidado
        data_type: numeric
      - name: vl_pago
        data_type: numeric
      - name: dt_inicio_vigencia
        data_type: date
      - name: dt_fim_vigencia
        data_type: date
      - name: dt_assinatura
        data_type: date
      - name: ds_situacao
        data_type: text
      - name: nr_processo_sei
        data_type: text
        description: >
          Processo SEI. TED: do termo de execucao mais recente. Tedinho: o
          processo da pagina do gov.br; nunca um numero de NC.
      - name: qt_aditivos
        data_type: integer
      - name: dt_ingest
        data_type: timestamptz
        description: >
          TED e tedinho: dt_ingest da fonte (ted_resumo_orcamentario). Convenio e
          termo de fomento: momento do build do dbt, porque os resumos do SICONV
          nao expoem a ingestao.

  - name: coleta_cobertura_identificador
    description: >
      Quantos instrumentos do contrato tem identificador do parceiro (UG/CNPJ),
      por tipo. Instrumento sem identificador nao pode ser acessado por gestor
      no Coleta MIR ate o MIR atribuir um manualmente.
    columns:
      - name: tp_instrumento
        tests:
          - unique
          - not_null
      - name: qt_total
      - name: qt_sem_identificador
      - name: pc_cobertura

  - name: coleta_instrumento_meta
    config:
      contract:
        enforced: true
    description: >
      Metas e etapas do plano de trabalho por instrumento, para a lista do item
      5.2 dos formularios do Coleta MIR. TED: plano_acao_meta/plano_acao_etapa
      da API de TED; convenio e termo de fomento: meta_crono_fisico do SICONV
      (sem etapas). Linha da meta tem nr_etapa nulo. O municipio vem por nome
      (no_municipio), como no SICONV; o Coleta casa com o IBGE. Grao:
      (chave_instrumento, id_origem). id_origem e a chave estavel da linha na
      fonte e deve ser usada por quem consome; nr_meta e nr_etapa sao a
      numeracao da fonte e podem se repetir.
    columns:
      - name: chave_instrumento
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('coleta_instrumento')
              field: chave
      - name: id_origem
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave estavel da linha na fonte: ted_meta:<id_meta>,
          ted_etapa:<id_etapa> ou siconv_meta:<id_meta>.
        tests:
          - not_null
          - unique
      - name: nr_meta
        data_type: integer
        tests:
          - not_null
      - name: nr_etapa
        data_type: integer
        description: Numero da etapa na fonte; pode se repetir dentro da meta.
      - name: no_meta
        data_type: text
      - name: ds_meta
        data_type: text
      - name: qt_meta
        data_type: numeric
      - name: ds_unidade
        data_type: text
      - name: sg_uf
        data_type: text
      - name: no_municipio
        data_type: text
      - name: dt_inicio
        data_type: date
      - name: dt_fim
        data_type: date

  - name: coleta_lista_ppa
    description: >
      Lista em cascata do PPA do MIR (revisao mais recente) para o Bloco 3.1:
      programa > objetivo especifico > indicador > meta; entrega pendurada no
      objetivo especifico; medida institucional no programa.
    columns:
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              values: ['programa', 'objetivo_especifico', 'indicador', 'meta', 'entrega', 'medida_institucional']
      - name: codigo
        tests:
          - not_null
      - name: codigo_pai
      - name: titulo
      - name: ano_ppa

  - name: coleta_lista_agenda
    description: "Agendas transversais e ODS (Blocos 3.1 e 3.2), uma linha por chave_agenda, inclusive as que sairam da revisao mais recente do PPA (in_vigente = false)."
    columns:
      - name: codigo
        tests:
          - unique
          - not_null
      - name: nome
      - name: grupo
      - name: nome_mae
      - name: in_vigente
        description: >
          true quando a agenda aparece na revisao mais recente do PPA (maior
          ano_ppa de programa_filtrado_mir, a mesma de coleta_lista_ppa). Agenda
          que saiu do PPA fica com false, sem ser apagada.
        tests:
          - not_null

  - name: coleta_lista_pei
    description: "Planejamento Estrategico Institucional (Bloco 3.3); espelho do seed pei_mir."
    columns:
      - name: nivel
      - name: codigo
        tests:
          - not_null
      - name: codigo_pai
      - name: titulo
