version: 2

models:

  - name: coleta_ted
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para os Blocos 1 e 2 do formulário de TEDs: um registro por
      TED firmado do MIR, com os campos que o formulário preenche sozinho. Fonte: portal
      TED (planos de ação, programa e termo de execução).

      Entra todo plano de ação com número de transferência que não foi rejeitado,
      vigente ou não: o Bloco 6 (relatório de cumprimento do objeto) também vale para
      TED encerrado. A tabela é refeita a cada carga: um TED some dela quando o plano é
      rejeitado ou perde o número no portal.

      Lido pelo Coleta MIR: mudar o nome, o tipo ou o significado de uma coluna quebra o
      consumidor. Coluna nova é segura.
    columns:
      - name: id_plano_acao
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave do contrato: o id do plano de ação no portal TED. É o que o Coleta deve
          guardar para ligar as respostas ao TED.

      - name: cd_ted
        data_type: text
        description: >
          Número do TED no formulário: o código do programa do TED no portal, com 14
          dígitos (id do MIR no portal, 308823, mais ano e sequencial). Ex.:
          30882320220003.
        tests:
          - not_null
          - unique

      - name: no_ted
        data_type: text
        description: "Nome do programa do TED, o título que o formulário mostra ao lado do número."

      - name: nr_transferencia
        data_type: text
        description: >
          Número da transferência no SIAFI, o que as NCs e NEs citam. Numérico até 2025
          (ex.: 930164); alfanumérico nos TEDs novos de 2026 (ex.: 7AAFAJ).
        tests:
          - not_null
          - unique

      - name: aa_instrumento
        data_type: integer
        description: "Ano da transferência."

      - name: ds_situacao_plano
        data_type: text
        description: "Situação do plano de ação no portal (ex.: APROVADO, ANALISE_APROVADA)."

      - name: ds_situacao_termo
        data_type: text
        description: >
          Situação do termo de execução (ex.: EM_EXECUCAO, CUMPRIMENTO_OBJETO_INICIADO,
          PENDENTE_REGISTRO_NO_SIAFI). Nulo quando o termo ainda não aparece na API de
          TED.

      - name: nr_processo_sei
        data_type: text
        description: "Processo SEI de formalização do TED, do termo de execução. Nulo quando o termo não traz."

      - name: dt_assinatura
        data_type: date
        description: "Data de celebração: assinatura do primeiro termo de execução do plano."

      - name: ds_objeto
        data_type: text
        description: "Objeto do TED, como está no plano de ação."

      - name: ds_justificativa
        data_type: text
        description: "Justificativa do plano de ação (item 3.6 do formulário)."

      - name: vl_total
        data_type: numeric(15, 2)
        description: "Valor total pactuado no plano de ação, em R$."

      - name: dt_inicio_vigencia
        data_type: date
        description: "Início da vigência do plano de ação."

      - name: dt_fim_vigencia
        data_type: date
        description: "Fim da vigência do plano de ação."

      - name: sg_unidade_acompanhamento
        data_type: text
        description: >
          Sigla da unidade do MIR que acompanha o TED (Bloco 2: unidade descentralizadora
          responsável). Ex.: SEPAR, SENAPIR-MIR, SQPT; MIR quando o plano não indica uma
          secretaria.

      - name: no_unidade_acompanhamento
        data_type: text
        description: "Nome da unidade do MIR que acompanha o TED."

      - name: sg_parceiro
        data_type: text
        description: "Sigla do órgão que recebeu o crédito (unidade descentralizada), cujo gestor preenche os Blocos 4 e 5."

      - name: no_parceiro
        data_type: text
        description: "Nome do órgão que recebeu o crédito."

      - name: cd_ug_parceiro
        data_type: text
        description: "UG (código SIAFI) do órgão que recebeu o crédito, segundo o portal TED."

      - name: cd_siorg_parceiro
        data_type: text
        description: >
          Código Siorg do órgão que recebeu o crédito, do beneficiário do programa. Nulo
          quando o programa tem mais de um beneficiário.

      - name: dt_atualizacao
        data_type: timestamptz
        description: >
          Carga mais antiga entre as fontes da linha. Herda o dt_ingest das bronzes, que
          interpretam como horário de Brasília um horário gravado em UTC (3 h adiantado).

  - name: coleta_lista_ppa
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para o item 3.1 do formulário de TEDs (vinculação ao PPA):
      a lista em cascata dos programas do MIR no PPA. Do programa saem o objetivo geral e
      os objetivos estratégicos, que o formulário preenche sozinho, e os objetivos
      específicos e medidas institucionais, que o servidor escolhe; do objetivo
      específico saem as entregas e as medidas institucionais dele. A opção "Não se
      aplica" é do formulário, não da lista.

      Entram os itens de todas as revisões do PPA, com o texto da revisão mais recente
      em que aparecem; quem saiu da última revisão fica com in_vigente = false.
    columns:
      - name: chave
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave do item: nível e código do PPA (ex.: 'programa:5802',
          'objetivo_especifico:0264', 'objetivo_estrategico:5802:1.9'). É o que a
          resposta do Coleta deve guardar.

      - name: nivel
        data_type: text
        description: >
          programa, objetivo_geral, objetivo_estrategico, objetivo_especifico, entrega,
          medida_institucional_programa ou medida_institucional_objetivo_especifico.
        tests:
          - not_null
          - accepted_values:
              values:
                - programa
                - objetivo_geral
                - objetivo_estrategico
                - objetivo_especifico
                - entrega
                - medida_institucional_programa
                - medida_institucional_objetivo_especifico

      - name: codigo
        data_type: text
        description: "Código do item no PPA (ex.: 5802, 0264, 0547). O do objetivo estratégico se repete entre programas."

      - name: chave_pai
        data_type: text
        description: "Chave do item de que este depende na cascata. Nulo no programa."
        tests:
          - relationships:
              to: ref('coleta_lista_ppa')
              field: chave

      - name: titulo
        data_type: text
        description: "Enunciado do item (no programa, o título)."

      - name: descricao
        data_type: text
        description: "Descrição do item, quando o PPA traz."

      - name: ds_publico_alvo
        data_type: text
        description: "Público-alvo do programa. Só preenchido no nível programa."

      - name: ano_ppa
        data_type: integer
        description: "Revisão do PPA de onde vem o texto: a mais recente em que o item aparece."

      - name: in_vigente
        data_type: boolean
        description: "O item está na revisão mais recente do PPA."

  - name: coleta_lista_agenda
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para os itens 3.1 (agendas transversais) e 3.2 (ODS) do
      formulário de TEDs: o catálogo nacional de agendas do PPA. Agenda transversal ->
      subagenda; ODS -> meta ODS. O catálogo só traz as metas ODS que o PPA usa (as dez
      do ODS 18 estão todas). Revisões a partir de 2025; quem saiu da última fica com
      in_vigente = false.
    columns:
      - name: chave
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        description: >
          Chave do item: 'ods:<número>' para o ODS e 'agenda:<código SIOP>' para agenda,
          subagenda e meta ODS. É o que a resposta do Coleta deve guardar.

      - name: nivel
        data_type: text
        description: "agenda_transversal, subagenda, ods ou meta_ods."
        tests:
          - not_null
          - accepted_values:
              values: ['agenda_transversal', 'subagenda', 'ods', 'meta_ods']

      - name: codigo
        data_type: text
        description: "Código do item no catálogo do SIOP; no ODS, o número."

      - name: chave_pai
        data_type: text
        description: "Agenda mãe da subagenda ou ODS da meta. Nulo na agenda transversal e no ODS."
        tests:
          - relationships:
              to: ref('coleta_lista_agenda')
              field: chave

      - name: nome
        data_type: text
        description: "Nome do item (ex.: 'Igualdade Racial', 'ODS 18 - Igualdade Étnico-Racial', 'ODS META 18.1')."

      - name: descricao
        data_type: text
        description: "Descrição do item no catálogo; na meta ODS, o texto da meta."

      - name: in_vigente
        data_type: boolean
        description: "O item está na revisão mais recente do catálogo. Sempre verdadeiro no ODS."
