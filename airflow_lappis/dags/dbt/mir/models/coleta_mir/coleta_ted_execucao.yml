version: 2

models:

  - name: coleta_ted_execucao
    config:
      contract:
        enforced: true
    description: >
      Contrato do Coleta MIR para o Bloco 1 do formulário de TEDs ("Valor empenhado" e
      "Valor liquidado / pago"): uma linha por TED de coleta_ted, com o acumulado de todos
      os exercícios. Fica separado de coleta_ted para uma falha na cadeia do SIAFI não
      travar os dados de identificação.

      Fonte: a consulta oficial "Execução TED por UG" aberta por instrumento
      (ted_execucao_por_instrumento). A consulta só traz EOF primário discricionário;
      para os TEDs que ela não traz (emenda, UG fora do recorte), soma as notas de empenho
      da UG favorecida da NC no mesmo PTRES. ds_origem_execucao diz de onde veio o valor
      de cada TED.

      Lido pelo Coleta MIR: mudar o nome, o tipo ou o significado de uma coluna quebra o
      consumidor. Coluna nova é segura. A tabela não traz data de carga.
    columns:
      - name: id_plano_acao
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        description: "TED da linha (coleta_ted.id_plano_acao). Chave do contrato."
        tests:
          - relationships:
              to: ref('coleta_ted')
              field: id_plano_acao

      - name: vl_empenhado
        data_type: numeric(15, 2)
        description: >
          "Valor empenhado" do formulário: empenhado líquido de todos os exercícios, em
          R$. Não inclui instrumento mesclado (vl_empenhado_compartilhado). Nulo quando
          ds_origem_execucao = 'sem_dado'; 0 quer dizer que não há empenho além do
          compartilhado.

          As NEs da UG 364150 do CNPq em 2023-25 chegam do Tesouro Gerencial em dólar e
          são convertidas em ppa_tesouro pela taxa de fechamento do ano de emissão
          (seed cambio_fechamento_exercicio), o que reproduz o valor oficial.

      - name: vl_pago
        data_type: numeric(15, 2)
        description: >
          "Valor liquidado / pago" do formulário, um campo só: o pago no exercício mais os
          restos a pagar pagos depois (pago_total de ted_execucao_por_instrumento), em
          R$. O liquidado está em vl_liquidado, numa coluna própria, porque não é
          comparável com este valor: o relatório só traz o liquidado do exercício, sem o
          RAP (nos TEDs de 2023, liquidado de R$ 27,85 mi contra pago total de R$ 47,71
          mi). Não inclui instrumento mesclado (vl_pago_compartilhado). Nulo quando
          ds_origem_execucao = 'sem_dado'.

      - name: vl_credito_liquido
        data_type: numeric(15, 2)
        description: >
          Crédito que ficou com o TED, em R$: soma de coleta_ted_fonte.vl_liquido. Fica
          para ser mostrado ao lado de coleta_ted.vl_total, sem escolher um dos dois:
          vl_total é a soma das etapas do plano, e há TED com crédito acima dele. Nulo
          quando o TED não tem linha em coleta_ted_fonte.

      - name: vl_empenhado_compartilhado
        data_type: numeric(15, 2)
        description: >
          Empenhado de instrumento mesclado da gold ("A + B"), junção que o crédito não
          permite separar. Sem rateio: o valor inteiro aparece em cada TED da junção,
          então não se soma entre TEDs. Nulo quando o TED não está em nenhuma.

      - name: vl_pago_compartilhado
        data_type: numeric(15, 2)
        description: "Pago total do mesmo instrumento mesclado, com a mesma regra de vl_empenhado_compartilhado."

      - name: ds_instrumento_compartilhado
        data_type: text
        description: "Instrumento mesclado em que o TED aparece (ex.: 949197 + 986437), separados por '; ' se houver mais de um."

      - name: ds_origem_execucao
        data_type: text
        constraints:
          - type: not_null
        description: >
          De onde vêm os valores. consulta_oficial: ted_execucao_por_instrumento.
          nota_de_empenho: NEs da UG favorecida da NC no mesmo PTRES, a partir do ano da
          primeira NC, porque a consulta não traz o TED (emenda, UG fora do recorte).
          sem_empenho: a consulta não traz o TED e não há NE com valor; vl_empenhado e
          vl_pago são 0. sem_dado: não há como dizer o valor, e os dois ficam nulos; o TED
          é anterior ao primeiro exercício da consulta, ou divide a célula (UG, PTRES) com
          outro TED fora da consulta (teste test_coleta_ted_execucao_celula_dividida).
        tests:
          - accepted_values:
              values:
                - consulta_oficial
                - nota_de_empenho
                - sem_empenho
                - sem_dado

      - name: vl_liquidado
        data_type: numeric(15, 2)
        description: >
          Liquidado do exercício, em R$, sem os restos a pagar — é só isso que o relatório
          traz. Fica separado de vl_pago de propósito: os dois não são comparáveis, porque
          vl_pago inclui o RAP pago. Não inclui instrumento mesclado. Nulo quando
          ds_origem_execucao = 'sem_dado'; 0 em 'sem_empenho' e nos TEDs que só aparecem
          em instrumento mesclado.

      - name: vl_rap_inscrito
        data_type: numeric(15, 2)
        description: >
          Restos a pagar inscritos, em R$: o que passou para RAP no fim do exercício de
          emissão da NE. Soma entre anos porque cada NE é contada uma vez só, no exercício
          seguinte ao da emissão — a reinscrição anual da NE não paga não entra, senão o
          valor inflaria a cada exercício. Mesma regra de nulo e 0 de vl_liquidado.

      - name: vl_rap_pago
        data_type: numeric(15, 2)
        description: >
          Restos a pagar pagos, em R$, somados em todos os exercícios seguintes. Já está
          dentro de vl_pago (que é pago do exercício mais RAP pago): esta coluna é a
          parcela, para quem precisa separar as duas, e não se soma a vl_pago. Mesma regra
          de nulo e 0 de vl_liquidado.

      - name: vl_rap_a_pagar
        data_type: numeric(15, 2)
        description: >
          Restos a pagar que faltam pagar, em R$: inscrito menos pago no último exercício
          do relatório. O relatório não traz o RAP cancelado durante esse exercício, então
          o valor é o saldo da posição, não um compromisso firme. Mesma regra de nulo e 0
          de vl_liquidado.

          Nos TEDs de ds_origem_execucao = 'nota_de_empenho', ppa_tesouro não tem coluna
          de RAP a pagar: o valor é derivado como em execucao_ted_ne (inscrito menos pago
          no último exercício do relatório, contando só exercício posterior ao da NE).
