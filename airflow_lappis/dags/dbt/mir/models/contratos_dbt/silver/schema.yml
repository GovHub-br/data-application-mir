version: 2

models:
  # ----------------------------------------------------------------------------
  # Contratos x Faturas
  # ----------------------------------------------------------------------------
  - name: contratos_faturas
    description: >
      Camada silver do cruzamento entre faturas e contratos do Compras GOV.
      Enriquece as faturas com dados cadastrais do contrato (fornecedor,
      número, objeto, unidades requisitantes) via left join por contrato_id,
      garantindo que todas as faturas sejam mantidas mesmo sem contrato
      correspondente.
    meta:
      tags:
        - silver
    columns:
      - name: id
        description: "Identificador único da fatura (herdado de faturas)."
      - name: contrato_id
        description: "Identificador do contrato ao qual a fatura pertence. Chave de junção com contratos.id."
      - name: numero
        description: "Número da fatura."
      - name: emissao
        description: "Data de emissão da fatura."
      - name: vencimento
        description: "Data de vencimento da fatura."
      - name: valor
        description: "Valor bruto da fatura."
      - name: valorliquido
        description: "Valor líquido da fatura."
      - name: data_liquidacao
        description: "Data de liquidação da fatura."
      - name: situacao
        description: "Situação da fatura."
      - name: dt_ingest
        description: "Data e hora (UTC-3) de ingestão do registro na camada raw."
      - name: numero_contrato
        description: "Número do contrato, propagado de contratos.numero. Nulo quando não há contrato correspondente."
      - name: contrato_processo
        description: "Número do processo do contrato, propagado de contratos.processo. Nulo quando não há contrato correspondente."
      - name: fornecedor_cnpj_cpf_idgener
        description: "CNPJ/CPF do fornecedor, propagado de contratos. Nulo quando não há contrato correspondente."
      - name: fornecedor_tipo
        description: "Tipo do fornecedor, propagado de contratos. Nulo quando não há contrato correspondente."
      - name: fornecedor_nome
        description: "Nome do fornecedor, propagado de contratos. Nulo quando não há contrato correspondente."
      - name: objeto_contrato
        description: "Objeto do contrato, propagado de contratos.objeto. Nulo quando não há contrato correspondente."
      - name: unidades_requisitantes
        description: "Unidades requisitantes do contrato, propagado de contratos. Nulo quando não há contrato correspondente."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.contratos_faturas'
          nome_coluna: 'id'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.contratos_faturas'
          nome_coluna: 'valor'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.contratos_faturas'
          nome_coluna: 'valorliquido'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.contratos_faturas'
          nome_coluna: 'emissao'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.contratos_faturas'
          nome_coluna: 'data_liquidacao'
          tipo_esperado: 'date'

  # ----------------------------------------------------------------------------
  # Cronogramas x Faturas Mensal
  # ----------------------------------------------------------------------------
  - name: cronogramas_faturas_mensal
    description: >
      Consolida, por contrato e mês, o valor previsto em cronograma e os valores 
      de faturas pagas e pendentes, calculando o saldo contratual disponível.
      Enriquece a visão consolidada com dados cadastrais do contrato via left join.
    meta:
      tags:
        - silver
    columns:
      - name: contrato_id
        description: "Identificador do contrato. Chave de junção com contratos.id."
      - name: anoref
        description: "Ano de referência do mês do cronograma."
      - name: mesref
        description: "Mês de referência do cronograma."
      - name: mes_referencia
        description: "Data do primeiro dia do mês de referência (YYYY-MM-01)."
      - name: valor_cronograma
        description: "Valor acumulado previsto no cronograma para o contrato no mês."
      - name: valor_faturas_pagas
        description: "Valor acumulado de faturas pagas (SIAFI Apropriado) emitidas no mês."
      - name: valor_faturas_pendentes
        description: "Valor acumulado de faturas pendentes emitidas no mês."
      - name: saldo_contratual_disponivel
        description: "Saldo contratual disponível calculada por (valor_cronograma - valor_faturas_pagas - valor_faturas_pendentes)."
      - name: numero_contrato
        description: "Número do contrato, propagado de contratos.numero. Nulo quando não há contrato correspondente."
      - name: situacao_contrato
        description: "Situação cadastral do contrato, propagada de contratos.situacao. Nulo quando não há contrato correspondente."
      - name: fornecedor_nome
        description: "Nome do fornecedor, propagado de contratos.fornecedor_nome. Nulo quando não há contrato correspondente."
      - name: fornecedor_cnpj_cpf_idgener
        description: "CNPJ/CPF do fornecedor, propagado de contratos. Nulo quando não há contrato correspondente."
      - name: orgao_contratante
        description: "Nome do órgão contratante, propagado de contratos. Nulo quando não há contrato correspondente."
      - name: unidade_gestora
        description: "Nome da Unidade Gestora (UG), propagado de contratos. Nulo quando não há contrato correspondente."
      - name: vigencia_inicio
        description: "Data de início da vigência do contrato, propagada de contratos."
      - name: vigencia_fim
        description: "Data de fim da vigência do contrato, propagada de contratos."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'contrato_id'
          tipo_esperado: 'text'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'anoref'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'mesref'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'mes_referencia'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'valor_cronograma'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'valor_faturas_pagas'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'valor_faturas_pendentes'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.cronogramas_faturas_mensal'
          nome_coluna: 'saldo_contratual_disponivel'
          tipo_esperado: 'numeric' 

  # ----------------------------------------------------------------------------
  # Estágios mensais (SIAFI)
  # ----------------------------------------------------------------------------
  - name: estagios_mensal
    description: >
      Camada silver que discrimina, mês a mês, os estágios da despesa (empenhado,
      liquidado, pago e restos a pagar) extraídos do SIAFI a partir da bronze
      empenhos_tesouro. Faz o parse de ne_ccor (nota de empenho), emissao_dia/
      emissao_mes (mês e ano de lançamento), ne_ccor_favorecido (CNPJ/CPF) e
      ne_info_complementar, agregando os valores por ne, cnpj_cpf e mês/ano de
      lançamento.

      Tratamento de Restos a Pagar (RAP): registros inscritos em RAP são
      identificados pelo prefixo '000/' em emissao_dia e desdobrados entre o ano
      de lançamento (mês original) e o ano de origem (mês 12), com o valor de
      restos_a_pagar invertido no ano de origem para refletir a baixa da inscrição.
      Replica a lógica validada no pipeline IPEA. Base do cruzamento
      contratos_estagios do domínio de Contratos.
    meta:
      tags:
        - silver
    columns:
      - name: ne
        description: >
          Número da nota de empenho padronizado, extraído das 12 últimas posições
          de ne_ccor.
      - name: cnpj_cpf
        description: "CNPJ ou CPF do favorecido do empenho (ne_ccor_favorecido)."
      - name: info_complementar
        description: >
          Informação complementar do empenho, extraída do prefixo numérico de
          ne_info_complementar.
      - name: num_processo
        description: >
          Número do processo administrativo associado ao empenho (menor
          ne_num_processo observado para a NE).
      - name: mes_lancamento
        description: >
          Mês de referência do lançamento (primeiro dia do mês), já com o
          desdobramento de RAP aplicado entre ano de lançamento e ano de origem.
      - name: valor_empenhado
        description: "Soma das despesas empenhadas no mês para a NE."
      - name: valor_liquidado
        description: "Soma das despesas liquidadas no mês para a NE."
      - name: valor_pago
        description: "Soma das despesas pagas no mês para a NE."
      - name: restos_a_pagar
        description: >
          Soma dos restos a pagar inscritos no mês para a NE. No ano de origem de
          um RAP o valor é registrado com sinal invertido.
      - name: restos_a_pagar_pago
        description: "Soma dos restos a pagar já quitados no mês para a NE."
      - name: dt_ingest
        description: >
          Data e hora (UTC-3 Brasília) mais recente de ingestão dos dados da fonte
          utilizada neste modelo.
    tests:
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'mes_lancamento'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'valor_empenhado'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'valor_liquidado'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'valor_pago'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'restos_a_pagar'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'contratos_dbt.estagios_mensal'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'
