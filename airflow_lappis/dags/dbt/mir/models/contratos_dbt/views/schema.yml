version: 2

models:

  - name: identificadores
    description: >
      Consolida por contrato os identificadores usados nos cruzamentos com os
      empenhos do Tesouro (SIAFI): nota de empenho (NE), processo, CNPJ/CPF do
      fornecedor e informação complementar (UG + modalidade + número do
      contrato/licitação). Base para os cruzamentos contratos_empenhos e
      contratos_estagios.

      O NE é consolidado a partir de duas fontes, unificadas via UNION:
      empenhos (nota_empenho, Compras GOV) e faturas (numero_empenho, extraído
      do JSON armazenado em dados_empenho). O resultado é então combinado com
      contratos via FULL JOIN por contrato_id.

      O NE final prioriza o valor vindo de empenhos/faturas sobre o número do
      próprio contrato, e só é considerado válido quando, após normalização
      (remoção de caracteres não alfanuméricos), possui exatamente 12
      caracteres; caso contrário, é nulo.
    columns:
      - name: contrato_id
        description: >
          Identificador do contrato. Vem de contratos (c.id) ou, quando o
          contrato não tem correspondência direta, do lado dos empenhos/faturas
          unificados (nu.contrato_id).
        tests:
          - not_null
      - name: categoria
        description: "Categoria do contrato."
      - name: processo
        description: >
          Número do processo do contrato, normalizado (somente dígitos,
          sem pontuação).
      - name: cnpj_cpf
        description: >
          CNPJ ou CPF do fornecedor, normalizado (somente dígitos,
          sem pontuação).
      - name: info_complementar
        description: >
          Concatenação da unidade gestora, modalidade e número do
          contrato/licitação (licitacao_numero, com fallback para numero).
      - name: ne
        description: >
          Nota de empenho (NE), priorizando a origem de empenhos/faturas sobre
          o número do contrato. Normalizada (somente alfanuméricos, maiúscula).
          Nula quando o valor normalizado não possui exatamente 12 caracteres.

  - name: preenchimento_meses
    description: >
      View de apoio criada para eliminar descontinuidades temporais nas
      visualizações em série mensal (camada Gold). Gera a grade completa de
      meses de referência para cada contrato, entre o seu primeiro (min) e
      último (max) mês de referência registrados em cronogramas_faturas_mensal,
      mesmo em períodos sem movimentação financeira.
    columns:
      - name: contrato_id
        description: "Identificador único do contrato."
        tests:
          - not_null
      - name: mes_referencia
        description: "Mês de referência na série temporal (primeiro dia do mês)."
        tests:
          - not_null
      - name: valor_cronograma
        description: "Valor do cronograma previsto para o mês de referência."
      - name: valor_faturas_pagas
        description: "Soma dos valores de faturas pagas no mês de referência."
      - name: valor_faturas_pendentes
        description: "Soma dos valores de faturas pendentes no mês de referência."
      - name: saldo_contratual_disponivel
        description: "Saldo contratual disponível no mês de referência."
      - name: numero_contrato
        description: "Número oficial do contrato."
      - name: situacao_contrato
        description: "Situação atual do contrato (ex: Ativo)."
      - name: fornecedor_nome
        description: "Nome ou razão social do fornecedor contratado."
      - name: fornecedor_cnpj_cpf_idgener
        description: "Identificador (CNPJ, CPF ou ID estrangeiro) do fornecedor."
      - name: orgao_contratante
        description: "Nome do órgão contratante."
      - name: unidade_gestora
        description: "Nome da unidade gestora responsável."
      - name: vigencia_inicio
        description: "Data de início da vigência do contrato."
      - name: vigencia_fim
        description: "Data de término da vigência do contrato."