version: 2

models:
  - name: programa_mir
    description: >
      Camada silver do PPA/SIOP — programas do PPA 2024-2027 (e suas revisões
      2025/2026) cujo órgão responsável é o MIR (`{{ var("orgao_mir") }}`).
      Mesmas colunas da bronze `programa`, apenas filtradas por órgão.
    meta:
      tags:
        - silver
    columns:
      - name: exercicio
        description: "Exercício"
      - name: programa
        description: "Código do Programa do PPA."
      - name: titulo
        description: "Título"
      - name: tipo
        description: "Tipo"
      - name: orgao
        description: "Órgão responsável pelo programa (filtrado para o MIR)."
        tests:
          - not_null
      - name: publico_alvo
        description: "Público-alvo"
      - name: descricao_do_problema
        description: "Descrição do Problema"
      - name: causa_do_problema
        description: "Causa do Problema"
      - name: evidencias_do_problema
        description: "Evidências do Problema"
      - name: justificativa_para_a_intervencao
        description: "Justificativa para a intervenção"
      - name: evolucao_historica
        description: "Evolução Histórica"
      - name: comparacoes_internacionais
        description: "Comparações Internacionais"
      - name: relacao_com_os_ods
        description: "Relação com os ODS"
      - name: agentes_envolvidos
        description: "Agentes Envolvidos"
      - name: articulacao_federativa
        description: "Articulação Federativa"
      - name: enfoque_transversal
        description: "Enfoque Transversal"
      - name: marco_legal
        description: "Marco Legal"
      - name: planos_nacionais_setoriais_e_regionais
        description: "Planos nacionais, setoriais e regionais"
      - name: despesa_corrente_1o_ano_ppa
        description: "Despesa Corrente - 1º ano PPA"
      - name: despesa_capital_1o_ano_ppa
        description: "Despesa Capital - 1º ano PPA"
      - name: orcamento_investimento_empresas_estatais_1o_ano_ppa
        description: "Orçamento Investimento Empresas Estatais - 1º ano PPA"
      - name: gastos_tributarios_1o_ano_ppa
        description: "Gastos Tributários - 1º ano PPA"
      - name: outras_fontes_1o_ano_ppa
        description: "Outras Fontes - 1º ano PPA"
      - name: despesa_corrente_2o_ano_ppa
        description: "Despesa Corrente - 2º ano PPA"
      - name: despesa_capital_2o_ano_ppa
        description: "Despesa Capital - 2º ano PPA"
      - name: orcamento_investimento_empresas_estatais_2o_ano_ppa
        description: "Orçamento Investimento Empresas Estatais - 2º ano PPA"
      - name: gastos_tributarios_2o_ano_ppa
        description: "Gastos Tributários - 2º ano PPA"
      - name: outras_fontes_2o_ano_ppa
        description: "Outras Fontes - 2º ano PPA"
      - name: despesa_corrente_3o_ano_ppa
        description: "Despesa Corrente - 3º ano PPA"
      - name: despesa_capital_3o_ano_ppa
        description: "Despesa Capital - 3º ano PPA"
      - name: orcamento_investimento_empresas_estatais_3o_ano_ppa
        description: "Orçamento Investimento Empresas Estatais - 3º ano PPA"
      - name: gastos_tributarios_3o_ano_ppa
        description: "Gastos Tributários - 3º ano PPA"
      - name: outras_fontes_3o_ano_ppa
        description: "Outras Fontes - 3º ano PPA"
      - name: despesa_corrente_4o_ano_ppa
        description: "Despesa Corrente - 4º ano PPA"
      - name: despesa_capital_4o_ano_ppa
        description: "Despesa Capital - 4º ano PPA"
      - name: orcamento_investimento_empresas_estatais_4o_ano_ppa
        description: "Orçamento Investimento Empresas Estatais - 4º ano PPA"
      - name: gastos_tributarios_4o_ano_ppa
        description: "Gastos Tributários - 4º ano PPA"
      - name: outras_fontes_4o_ano_ppa
        description: "Outras Fontes - 4º ano PPA"
      - name: ano_ppa
        description: "Ano da revisão/vigência do PPA (2024, 2025 ou 2026)."
        tests:
          - not_null
      - name: id_hash
        description: "Chave surrogate herdada da bronze (md5 das colunas de negócio + ano_ppa)."
        tests:
          - not_null
          - unique
      - name: dt_ingest
        description: "Timestamp de ingestão (auditoria, herdado da bronze)."

  - name: acao_nao_orcamentaria_mir
    description: >
      Camada silver do PPA/SIOP — ações não-orçamentárias (o "Ação_Orçamentária"
      renomeado em 2026, mesma entidade — ver bronze `acao_nao_orcamentaria`)
      vinculadas a um programa do MIR via inner join com `programa_mir`
      (chave `programa` + `ano_ppa`).
    meta:
      tags:
        - silver
    columns:
      - name: exercicio
        description: "Exercício"
      - name: programa
        description: "Código do Programa do PPA a que a ação pertence (programa do MIR)."
        tests:
          - not_null
      - name: acao_nao_orcamentaria
        description: "Ação Não-Orçamentária"
      - name: descricao
        description: "Descrição"
      - name: tipo
        description: "Tipo"
      - name: fonte_de_informacoes
        description: "Fonte de Informações"
      - name: fonte_de_recursos
        description: "Fonte de Recursos"
      - name: especificacao_da_outra_fonte_de_financiamento
        description: "Especificação da Outra Fonte de Financiamento"
      - name: valor_total
        description: "Valor Total"
      - name: valor_previsto_para_o_1o_ano_do_ppa
        description: "Valor Previsto para o 1o. Ano do PPA"
      - name: valor_previsto_para_o_2o_ano_do_ppa
        description: "Valor Previsto para o 2o. Ano do PPA"
      - name: valor_previsto_para_o_3o_ano_do_ppa
        description: "Valor Previsto para o 3o. Ano do PPA"
      - name: valor_previsto_para_o_4o_ano_do_ppa
        description: "Valor Previsto para o 4o. Ano do PPA"
      - name: produto
        description: "Produto"
      - name: especificacao_do_produto
        description: "Especificação do Produto"
      - name: unidade_de_medida
        description: "Unidade de Medida"
      - name: meta_fisica
        description: "Meta Física"
      - name: titulo
        description: "Título"
      - name: responsavel_pela_informacao
        description: "Responsável pela informação"
      - name: tributo
        description: "Tributo"
      - name: valor_previsto_para_2028
        description: "Valor Previsto para 2028"
      - name: funcao
        description: "Função"
      - name: subfuncao
        description: "Subfunção"
      - name: inicio_da_vigencia
        description: "Início da Vigência"
      - name: termino_da_vigencia
        description: "Término da vigência"
      - name: vigencia_indeterminada
        description: "Vigência indeterminada"
      - name: fonte_dos_dados
        description: "Fonte dos Dados"
      - name: base_legal
        description: "Base Legal"
      - name: tipo_de_beneficiario
        description: "Tipo de beneficiário"
      - name: descricao_do_beneficiario
        description: "Descrição do beneficiário"
      - name: total_de_beneficiarios_previstos_1_ano_de_ppa
        description: "Total de beneficiários previstos 1° Ano de PPA"
      - name: total_de_beneficiarios_previstos_2_ano_de_ppa
        description: "Total de beneficiários previstos 2° Ano de PPA"
      - name: total_de_beneficiarios_previstos_3_ano_de_ppa
        description: "Total de beneficiários previstos 3° Ano de PPA"
      - name: total_de_beneficiarios_previstos_4_ano_de_ppa
        description: "Total de beneficiários previstos 4° Ano de PPA"
      - name: valor_previsto_para_2029
        description: "Valor Previsto para 2029"
      - name: ano_ppa
        description: "Ano da revisão/vigência do PPA (2024, 2025 ou 2026)."
        tests:
          - not_null
      - name: id_hash
        description: "Chave surrogate herdada da bronze (md5 das colunas de negócio + ano_ppa)."
