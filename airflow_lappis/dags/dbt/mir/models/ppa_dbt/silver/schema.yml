version: 2

models:
  - name: programa_filtrado_mir
    description: >
      Camada silver do PPA/SIOP — programas do PPA 2024-2027 (e suas revisões
      2025/2026) cujo órgão responsável é o MIR (`{{ var("orgao_mir") }}`).
      Mesmas colunas da bronze `programa`, apenas filtradas por órgão.
