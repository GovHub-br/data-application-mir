version: 2

models:

  - name: ted_resumo_orcamentario
    description: >
      {{ doc("glossario_ted") }}

      Tabela gold de consolidação orçamentária e financeira por instrumento do MIR — TED
      ou tedinho (issue #507: descentralização de crédito sem registro no TransfereGov).
      O grão é o instrumento: uma linha por transferência canônica (num_transf_canon) para
      TED, uma linha por instrumento_key para tedinho (ver tedinhos_mir — nc_transferencia
      quando atribuído, senão processo administrativo extraído da NC, senão a própria NC) —
      tipo_instrumento distingue os dois; coalesce(num_transf, processo) é o identificador.
      Bloco TED: quatro fontes — o valor total pactuado no plano (TransfereGov), os créditos orçamentários via
      Notas de Crédito (SIAFI), os empenhos das Notas de Empenho (SIAFI) e os recursos das
      Programações Financeiras (SIAFI + TransfereGov) — combinadas via FULL JOIN por
      num_transf_canon para não perder registro que exista em apenas uma fonte; como as
      quatro fontes estão no mesmo grão, o join é 1:1 e todas as métricas são somáveis. O
      plano_acao NÃO faz parte da chave: é resolvido como atributo da transferência pela
      ponte canônica num_transf_n_plano_acao (1:1 por transferência). A UG responsável provém
      apenas dos empenhos e é exposta consolidada (ugs_responsaveis_codigos/nomes +
      qtd_ugs_responsaveis); quando a UG esteve no grão, transferências com múltiplas UGs
      repetiam os valores dos demais blocos em cada linha e inflavam qualquer soma. Para o
      detalhe por UG use ted_empenhos_plano_acao, que tem grão de Nota de Empenho — só cobre
      TED, não tedinho (ver tedinhos_mir para a limitação de empenho por tedinho). Bloco
      Tedinho: só orcamento_recebido/devolvido vêm preenchidos (via tedinhos_mir, que já
      aplica a detecção correta por nc_evento_descricao + cruzamento com TransfereGov);
      plano_acao, valor_firmado e todas as métricas de empenho/liquidação/pagamento/
      financeiro ficam nulas — a NE do órgão executor carrega o processo administrativo
      *dele*, não o do MIR, então não há hoje um join confiável entre o processo do tedinho
      e empenhos_por_plano_acao (confirmado: 0 de 23 processos conhecidos batem via
      ne_num_processo). Fechar essa lacuna exige uma fonte adicional (de-para processo MIR
      -> processo da instituição executora), fora do escopo desta mudança.
    columns:
      - name: plano_acao
        description: >
          Identificador do Plano de Ação no TransfereGov, resolvido como atributo da
          transferência via a ponte num_transf_n_plano_acao (1:1). Nulo quando a
          transferência não possui plano correspondente cadastrado, ou sempre nulo para
          tedinho (que por definição não tem plano no TransfereGov). NÃO é chave do grão
          nem unidade de contagem do painel — para contar TEDs use id_instrumento.
      - name: tipo_instrumento
        description: "'TED' ou 'Tedinho' — distingue as duas origens do grão. Ver descrição da tabela."
        tests:
          - not_null
          - accepted_values:
              values: ['TED', 'Tedinho']
      - name: num_transf
        description: >
          Número canônico da transferência TED (num_transf_canon, normalizado por
          ltrim/trim de zeros à esquerda) — o elo entre SIAFI e TransfereGov. Preenchido
          apenas quando tipo_instrumento = 'TED'; nulo para tedinho (ver coluna processo).
      - name: processo
        description: >
          Melhor identificador humano disponível para o tedinho: processo administrativo
          (SEI), quando a NC é do relatório pós-2026 e cita processo no texto; senão o
          código de transferência mais recente do SIAFI (nc_transferencia_atual, mesmo não
          registrado no TransfereGov); senão o número da própria Nota de Crédito, como
          último recurso (NCs pré-2026 sem processo extraível). Preenchido apenas quando
          tipo_instrumento = 'Tedinho'; nulo para TED (ver coluna num_transf). NÃO é a
          chave do grão — a chave real é instrumento_key em tedinhos_mir (coalesce aqui
          pode juntar sinais de fontes diferentes por instrumento).
      - name: sigla_unidade_descentralizada
        description: >
          Sigla da unidade receptora dos recursos, conforme cadastrado no Plano de Ação do TransfereGov.
      - name: valor_firmado
        description: >
          Valor total pactuado no Plano de Ação (vl_total_plano_acao), conforme o registro
          mais recente no TransfereGov. Representa o compromisso financeiro acordado.
      - name: aa_ano_plano_acao
        description: >
          Ano em que o Plano de Ação foi pactuado no TransfereGov (issue #510). É o ano do
          PLANEJAMENTO, não o exercício em que a despesa de fato ocorreu — um plano de 2022
          pode nunca ter sido empenhado, ou ter sido empenhado anos depois. Para abrir
          valores financeiros por ano real da despesa, use
          ted_resumo_orcamentario_por_exercicio. Nulo para tedinho e para TED sem plano
          cadastrado — o filtro de ano do painel usa ano_pactuacao, que cobre os dois.
      - name: dt_inicio_vigencia
        description: "Data de início de vigência do Plano de Ação no TransfereGov. Nulo para tedinho e para TED sem plano cadastrado."
      - name: dt_fim_vigencia
        description: "Data de fim de vigência do Plano de Ação no TransfereGov. Nulo para tedinho e para TED sem plano cadastrado."
      - name: situacao_plano_acao
        description: >
          Situação do Plano de Ação no TransfereGov (ex.: APROVADO, REJEITADO,
          ANALISE_APROVADA). Nunca nula (issue #510, critério de aceite): quando não há
          plano de ação resolvido — TED sem plano cadastrado no TransfereGov, ou tedinho,
          que por definição nunca tem — o valor é o rótulo explícito "Sem plano de ação
          cadastrado", para que o painel nunca precise tratar branco/nulo como ausência de
          instrumento.
        tests:
          - not_null
      - name: orcamento_recebido
        description: >
          Crédito descentralizado nas Notas de Crédito do TED (descentralizações menos
          anulações).
      - name: orcamento_devolvido
        description: >
          Crédito devolvido nas Notas de Crédito do TED (devoluções de descentralização).
      - name: empenhado
        description: >
          Soma dos valores positivos de despesas_empenhadas — empenhos formalizados,
          excluindo anulações.
      - name: empenho_anulado
        description: >
          Soma dos valores absolutos das despesas_empenhadas negativas — empenhos
          cancelados ou revertidos após a emissão.
      - name: despesas_pagas_exercicio
        description: >
          Total de despesas pagas no exercício corrente, proveniente do campo
          despesas_pagas das Notas de Empenho.
      - name: despesas_pagas_rap
        description: >
          Total de despesas pagas via Restos a Pagar (exercícios anteriores),
          proveniente de restos_a_pagar_pagos das Notas de Empenho.
      - name: restos_a_pagar
        description: >
          Valor total inscrito como Restos a Pagar — despesas empenhadas e não
          pagas até o encerramento do exercício fiscal.
      - name: despesas_liquidada
        description: >
          Soma das despesas liquidadas — despesas com bens ou serviços
          efetivamente entregues e atestados.
      - name: financeiro_recebido
        description: >
          Soma dos valores de Programações Financeiras com ação 'TRANSFERENCIA',
          representando os recursos financeiros efetivamente recebidos pelo MIR.
      - name: financeiro_devolvido
        description: >
          Soma dos valores de Programações Financeiras com ação 'DEVOLUCAO',
          representando recursos financeiros devolvidos ao concedente.
      - name: financeiro_cancelado
        description: >
          Soma dos valores de Programações Financeiras com ação 'CANCELAMENTO',
          representando programações canceladas antes de seu processamento.
      - name: dt_ingest
        description: >
          Timestamp mais recente de ingestão entre todas as fontes que compõem o registro
          (ted_plano_acao_consolidado, nc_plano_acao, empenhos_por_plano_acao, pf_unificado).
          Indica quando os dados foram atualizados pela última vez (UTC-3).
      - name: sigla_unidade_responsavel_acompanhamento
        description: >
          Sigla da unidade responsável pelo acompanhamento do programa, proveniente
          de programas_ted (TransfereGov).
      - name: tx_nome_institucional_programa
        description: >
          Nome institucional do programa ao qual o Plano de Ação está vinculado,
          proveniente de programas_ted (TransfereGov).
      - name: tx_objetivo_programa
        description: >
          Descrição do objetivo do programa, proveniente de programas_ted (TransfereGov).
      - name: programa_governo
        description: >
          Código do programa de governo conforme classificação orçamentária SIAFI,
          proveniente de nc_plano_acao.
      - name: programa_governo_descricao
        description: >
          Descrição do programa de governo conforme classificação orçamentária SIAFI,
          proveniente de nc_plano_acao.
      - name: ugs_responsaveis_codigos
        description: >
          Códigos das Unidades Gestoras (UG) responsáveis pelos empenhos da transferência,
          consolidados em lista separada por vírgula. Substitui ug_responsavel_codigo, que
          colocava a UG no grão e duplicava as métricas de transferência.
      - name: ugs_responsaveis_nomes
        description: >
          Nomes das Unidades Gestoras (UG) responsáveis pelos empenhos da transferência,
          consolidados em lista separada por vírgula.
      - name: qtd_ugs_responsaveis
        description: >
          Quantidade de UGs distintas que empenharam na transferência. Vale 1 na maioria
          dos casos; acima de 1 indica execução compartilhada entre unidades — use
          ted_empenhos_plano_acao para abrir o detalhe.
      - name: origem
        description: >
          Para TED: 'Emenda - <autor>' se vinculado a uma emenda parlamentar, 'Recurso
          Próprio' caso contrário. Para tedinho: sempre 'Tedinho (sem registro no
          TransfereGov)' — a vinculação a emenda ainda não é resolvida para esse tipo.
      - name: id_instrumento
        description: >
          Chave única do instrumento — a unidade de contagem dos cards do painel (ver
          glossário). Para TED é o num_transf; para tedinho é o instrumento_key de
          tedinhos_mir, sempre prefixado (proc:/transf:/nc:), então os dois nunca
          colidem. Qtd TEDs do painel = count(distinct id_instrumento).
        tests:
          - unique
          - not_null
      - name: ano_pactuacao
        description: >
          Ano do instrumento, usado no filtro "Ano de Pactuação". Para TED é o ano do
          Plano de Ação (aa_ano_plano_acao); para tedinho, que não tem plano, é o ano da
          primeira Nota de Crédito de descentralização (emissao_dia, ou o ano no número
          da NC quando emissao_dia não vem, caso das NCs até 2025). Nulo só para TED sem
          plano cadastrado. Como aa_ano_plano_acao, é o ano da pactuação, não o exercício
          da despesa.
      - name: situacao_empenho
        description: >
          Situação de empenho do instrumento, base dos cards "TEDs com/sem Empenho".
          'Com empenho' quando o empenhado líquido de anulação (empenhado -
          empenho_anulado) é positivo; 'Sem empenho' caso contrário. Tedinho recebe
          'Empenho não rastreável (tedinho)': não há join confiável entre o tedinho e as
          NEs, então classificá-lo como sem empenho seria afirmar algo que o painel não
          mede. Os três valores somam o total de instrumentos.
        tests:
          - not_null
          - accepted_values:
              values: ['Com empenho', 'Sem empenho', 'Empenho não rastreável (tedinho)']
      - name: situacao_vigencia
        description: >
          Situação de vigência do instrumento, base dos cards "TEDs Vigentes/Não
          Vigentes" e do filtro "Situação da Vigência". 'Vigente' quando
          dt_fim_vigencia >= data do build da tabela; 'Não vigente' quando já passou;
          'Sem vigência cadastrada' quando não há data de fim (tedinho e TED sem plano
          de ação cadastrado). Os três valores somam o total de instrumentos.
        tests:
          - not_null
          - accepted_values:
              values: ['Vigente', 'Não vigente', 'Sem vigência cadastrada']
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'valor_firmado'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'empenhado'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'aa_ano_plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'dt_inicio_vigencia'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario'
          nome_coluna: 'situacao_plano_acao'
          tipo_esperado: 'text'

  - name: ted_resumo_orcamentario_por_exercicio
    description: >
      Tabela gold de execução financeira de TED aberta por exercício da despesa (issue
      #510). ted_resumo_orcamentario agrega cada TED numa única linha; aqui o grão é
      (num_transf, exercício), onde exercício é o ano real de emissão da NE
      (ne_ccor_ano_emissao), não o ano do plano de ação (aa_ano_plano_acao — quando o
      plano foi pactuado, não quando a despesa ocorreu). Soma de empenhado aqui reconcilia
      1:1 com a soma de empenhado de tipo_instrumento = 'TED' em ted_resumo_orcamentario
      (ver teste de reconciliação). Só cobre TED — tedinho não tem join confiável com
      empenhos_por_plano_acao (mesma limitação documentada em ted_resumo_orcamentario).
    columns:
      - name: num_transf
        description: "Número canônico da transferência TED (num_transf_canon). Chave do grão junto com exercicio."
        tests:
          - not_null
      - name: plano_acao
        description: >
          Identificador do Plano de Ação no TransfereGov, resolvido via a ponte
          num_transf_n_plano_acao. Nulo quando a transferência não possui plano
          correspondente cadastrado (ver ted_resumo_orcamentario).
      - name: exercicio
        description: >
          Ano real de emissão da NE (ne_ccor_ano_emissao) — o exercício da despesa.
          Chave do grão junto com num_transf. Linhas com despesas_empenhadas = 0 em todas
          as NEs de um exercício não aparecem (ex.: os planos de ação de 2022 citados na
          issue #510, que nunca tiveram empenho em nenhum exercício).
        tests:
          - not_null
      - name: empenhado
        description: "Soma de despesas_empenhadas positivas no exercício — mesma definição de ted_resumo_orcamentario.empenhado, aberta por ano."
      - name: empenho_anulado
        description: "Soma dos valores absolutos de despesas_empenhadas negativas no exercício."
      - name: despesas_pagas_exercicio
        description: "Total pago no exercício corrente (despesas_pagas), aberto por ano de emissão da NE."
      - name: despesas_pagas_rap
        description: "Total pago via Restos a Pagar no exercício, aberto por ano de emissão da NE."
      - name: restos_a_pagar
        description: "Valor inscrito em Restos a Pagar no exercício."
      - name: despesas_liquidada
        description: "Soma das despesas liquidadas no exercício."
      - name: dt_ingest
        description: "Timestamp mais recente de ingestão entre as NEs do exercício (UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario_por_exercicio'
          nome_coluna: 'plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario_por_exercicio'
          nome_coluna: 'exercicio'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario_por_exercicio'
          nome_coluna: 'empenhado'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_resumo_orcamentario_por_exercicio'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'

  - name: ted_empenhos_plano_acao
    description: >
      Tabela gold de Notas de Empenho do SIAFI vinculadas a Planos de Ação TED do MIR.
      Filtra empenhos_por_plano_acao mantendo apenas os registros com plano_acao não nulo,
      ou seja, NEs cujo número de transferência TED foi identificado e possui correspondência
      no TransfereGov. Remove as colunas operacionais do pipeline de extração (complemento_ted,
      num_ted, numero_base, ano_raw, ano_normalizado, ano_oficial, numero_ted_normalizado,
      num_transf_pa), expondo somente os campos de negócio.
    columns:
      - name: emissao_mes
        description: "Mês de emissão da NE no SIAFI."
      - name: emissao_dia
        description: "Data de emissão da NE no SIAFI."
      - name: ne_ccor
        description: "Chave completa da Nota de Empenho no SIAFI."
      - name: ug_responsavel_codigo
        description: "Código da Unidade Gestora (UG) responsável pela NE."
      - name: ug_responsavel_nome
        description: "Nome da Unidade Gestora (UG) responsável pela NE."
      - name: plano_orcamentario_codigo_uo
        description: "Código da Unidade Orçamentária (UO) na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_funcao
        description: "Código da função de governo na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_subfuncao
        description: "Código da subfunção de governo na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_programa
        description: "Código do programa na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_acao
        description: "Código da ação na classificação do plano orçamentário."
      - name: ne_num_processo
        description: "Número do processo administrativo associado à NE, limpo de pontos, barras e hifens."
      - name: ne_info_complementar
        description: "Campo complementar da NE."
      - name: ne_ccor_descricao
        description: "Descrição livre da NE — campo principal de onde os métodos de extração identificam o num_transf via regex."
      - name: doc_observacao
        description: "Campo de observação do documento associado à NE."
      - name: natureza_despesa
        description: "Código da natureza de despesa da NE (ex: 339030)."
      - name: natureza_despesa_descricao
        description: "Descrição da natureza de despesa da NE."
      - name: ne_ccor_favorecido
        description: "CNPJ ou CPF do favorecido do empenho, padronizado em maiúsculas."
      - name: ne_ccor_favorecido_descricao
        description: "Nome ou razão social do favorecido da NE."
      - name: ne_ccor_ano_emissao
        description: "Ano de emissão da NE (integer, YYYY)."
      - name: ptres
        description: "Programa de Trabalho Resumido (PTRES) vinculado à NE no SIAFI."
      - name: fonte_recursos_detalhada
        description: "Código detalhado da fonte de recursos da NE."
      - name: fonte_recursos_detalhada_descricao
        description: "Descrição da fonte de recursos da NE."
      - name: despesas_empenhadas
        description: "Valor empenhado da NE (numeric 15,2). Positivo = novo empenho; negativo = anulação."
      - name: despesas_liquidadas
        description: "Valor liquidado (numeric 15,2) — despesas com bens ou serviços confirmados como entregues."
      - name: despesas_pagas
        description: "Valor efetivamente pago no exercício corrente (numeric 15,2)."
      - name: restos_a_pagar_inscritos
        description: "Valor inscrito em Restos a Pagar (numeric 15,2) — empenhado e não pago até o encerramento do exercício."
      - name: restos_a_pagar_pagos
        description: "Valor de Restos a Pagar efetivamente quitado (numeric 15,2)."
      - name: ne
        description: "Identificador curto da Nota de Empenho — últimos 12 caracteres de ne_ccor."
      - name: orgao_id
        description: "Código do órgão emitente da NE — primeiros 6 caracteres de ne_ccor."
      - name: nc
        description: "Número da Nota de Crédito associada à NE, extraído de ne_ccor_descricao e formatado pela UDF format_nc."
      - name: num_transf
        description: "Número da transferência TED extraído da NE. Chave de ligação com o Plano de Ação no TransfereGov."
      - name: plano_acao
        description: >
          Identificador do Plano de Ação no TransfereGov (integer), obtido via ponte
          num_transf_n_plano_acao a partir do num_transf. Nunca nulo nesta tabela gold —
          o filtro plano_acao is not null é a condição de entrada.
      - name: dt_ingest
        description: "Timestamp de ingestão da NE no SIAFI (timestamptz, UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_empenhos_plano_acao'
          nome_coluna: 'plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_empenhos_plano_acao'
          nome_coluna: 'ne_ccor_ano_emissao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_empenhos_plano_acao'
          nome_coluna: 'despesas_empenhadas'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_empenhos_plano_acao'
          nome_coluna: 'despesas_liquidadas'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.ted_empenhos_plano_acao'
          nome_coluna: 'restos_a_pagar_inscritos'
          tipo_esperado: 'numeric'
  - name: ted_auditoria_cascata
    description: >
      Auditoria da cascata de extração de num_transf: para onde vai cada real de empenho
      que passa pela cascata, e por qual motivo. Issue #508 — este modelo é o "número
      fechado explicando a diferença de empenhado/liquidado entre painel e CGPO,
      decomposto por motivo" pedido no critério de aceite.
      Toda NE de ppa_tesouro (exceto as linhas de dotação, ne_ccor = '-9') cai em
      exatamente uma linha de agregação, então as somas fecham com o total da fonte e
      nenhum valor fica fora do relatório — garantido por test_ted_auditoria_cascata_fecha.
      A convenção de valor é idêntica à de valores_empenhados_tb em ted_resumo_orcamentario
      (empenhado conta só despesas_empenhadas positivas; a anulação vai para
      empenho_anulado) para que os números sejam comparáveis com o painel sem ajuste.
      Não há eixo de tipo de instrumento: desde a issue #510 a cascata já descarta na
      origem qualquer número presente no cadastro do SICONV, então o que chega ao painel
      não é mais contaminado por Convênio/Termo de Fomento — o volume dessa exclusão
      aparece na categoria 'e_excluido_siconv'.
      Lembre o escopo: a cascata é de governo inteiro, então o grosso do volume está em
      destino = 'residuo', categoria 'a_sem_mencao_ted', que é orçamento próprio de outras
      UGs e não perda do MIR. O que importa para a reconciliação são as categorias 'b' e
      'c' do resíduo.
    columns:
      - name: destino
        description: >
          'painel' se a NE entra no empenhado da gold, 'residuo' caso contrário. A condição
          reproduz a de valores_empenhados_tb — num_transf não nulo E que não canonicalize
          para vazio — porque um num_transf de zeros é descartado pela gold e portanto é
          resíduo, não painel.
        tests:
          - not_null
          - accepted_values:
              values: ['painel', 'residuo']
      - name: categoria_residuo
        description: "Motivo do descarte (a/b/c/d/e — ver empenhos_ted_residuo). Nulo quando destino = 'painel'."
      - name: descartado_em
        description: "'silver' ou 'gold' — em qual filtro a linha morreu. Nulo quando destino = 'painel'."
      - name: metodo_familia
        description: >
          Família do método que resolveu (ou não) a NE: a parte do metodo antes do primeiro
          ':'. Os métodos 'pagina gov.br' e 'empenho de origem' embutem o número do TED e a
          NE de origem na string de metodo; agregar pelo metodo cru fragmentaria o relatório
          em grupos quase individuais e quebraria a promessa de agregado por método. Para o
          metodo detalhado use empenhos_ted_residuo.
      - name: qtd_nes
        description: "Quantidade de linhas de NE no grupo."
      - name: qtd_instrumentos
        description: "Quantidade de num_transf distintos no grupo (0 no resíduo, que não tem num_transf)."
      - name: empenhado
        description: "Soma de despesas_empenhadas positivas."
      - name: empenho_anulado
        description: "Soma do módulo das despesas_empenhadas negativas."
      - name: liquidado
        description: "Soma de despesas_liquidadas."
      - name: pago
        description: "Soma de despesas_pagas do exercício."

  - name: ted_execucao_por_instrumento
    description: >
      Execução dos TEDs do MIR por instrumento: a consulta oficial "Execução TED por UG"
      aberta por TED ou tedinho, a partir das NEs (execucao_ted_ne_vinculo). Grão: ano x
      instrumento. O que nenhuma regra resolveu fica em '(não identificado)', sem rateio;
      a soma por ano reproduz o empenhado, liquidado e pago das NEs da consulta oficial.
    columns:
      - name: ano
        description: "Ano de emissão da NE."
      - name: instrumento
        description: "Número do TED, 'tedinho <NC>', junção ('A + B') ou '(não identificado)'."
      - name: tipo_instrumento
        description: "TED ou Tedinho (nulo para não identificado)."
      - name: empenhado
        description: "Empenhado líquido."
      - name: liquidado
        description: "Liquidado no exercício."
      - name: pago
        description: "Pago no exercício."
      - name: empenhado_cascata_dbt
        description: "Parte do empenhado ligada pela cascata dbt (empenhos_por_plano_acao)."
      - name: empenhado_regras_deterministicas
        description: "Parte ligada pelas regras de texto (A1, A2, D, B, C, E)."
      - name: empenhado_credito_ug
        description: "Parte ligada pelo crédito da célula (G1 a G6)."
      - name: empenhado_tedinho_subdescentralizacao
        description: "Parte ligada por NC citada, subdescentralização ou intermediário (T, S, R)."
      - name: empenhado_nao_identificado
        description: "Parte sem instrumento."
      - name: parceiro
        description: >
          Sigla da unidade descentralizada do plano de ação (TED com plano) ou, para
          tedinho, a sigla do parceiro na página do gov.br (ted_tedinho_gov_br).
      - name: objeto
        description: >
          Objeto do plano de ação ou, para tedinho, o objeto da página do gov.br (200
          primeiros caracteres).
      - name: nome_instrumento
        description: >
          Nome legível do instrumento: o próprio número do TED; para tedinho
          identificado na página do gov.br, "tedinho Processo 21290.../AAAA-xx
          (SIGLA)"; instrumento mesclado ("A + B") recebe o nome de cada parte. Os
          demais tedinhos ficam como "tedinho <NC>".
      - name: processo_gov_br
        description: >
          Processo SEI do tedinho na página do gov.br (vários, separados por '; ', no
          instrumento mesclado).

  - name: ted_execucao_por_ne
    description: >
      Cada NE da consulta oficial "Execução TED por UG" com o instrumento e a regra que o
      identificou (detalhe de ted_execucao_por_instrumento). Filtrar
      grupo_regra = '6 não identificado' dá as NEs ainda sem instrumento. Grão: uma linha
      por NE.
    columns:
      - name: ne_ccor
        description: "NE."
        tests:
          - unique
          - not_null
      - name: ug_nome
        description: "Nome da UG executora na consulta oficial."
      - name: orgao_nome
        description: "Nome do órgão na consulta oficial."
      - name: instrumento
        description: "Instrumento (nulo se não identificado)."
      - name: regra
        description: "Regra que identificou o instrumento."
      - name: grupo_regra
        description: "Camada da regra."
      - name: empenhado
        description: "Empenhado líquido da NE."
      - name: liquidado
        description: "Liquidado no exercício."
      - name: pago
        description: "Pago no exercício."
