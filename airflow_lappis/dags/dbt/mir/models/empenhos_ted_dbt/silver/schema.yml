version: 2

models:
  - name: pf_unificado
    description: >
      Tabela silver que unifica as programacoes financeiras do Tesouro Gerencial
      (pf_tesouro) e do Transferegov (pf_transfere), realizando o cruzamento pela
      chave normalizada da PF. A chave e formada pelos ultimos 12 caracteres do campo
      pf no Tesouro e comparada com tx_numero_programacao no Transferegov.
    columns:
      - name: emissao_mes
        description: "Mes de emissao da programacao financeira no Tesouro."
      - name: emissao_dia
        description: "Data de emissao da programacao financeira no Tesouro."
      - name: ug_emitente
        description: "Codigo da UG emitente no Tesouro Gerencial."
      - name: ug_emitente_descricao
        description: "Descricao da UG emitente no Tesouro Gerencial."
      - name: ug_favorecido
        description: "Codigo da UG favorecida no Tesouro Gerencial."
      - name: ug_favorecido_descricao
        description: "Descricao da UG favorecida no Tesouro Gerencial."
      - name: pf_evento
        description: "Codigo do evento da programacao financeira no Tesouro."
      - name: pf_evento_descricao
        description: "Descricao do evento da programacao financeira no Tesouro."
      - name: pf
        description: "Identificador completo da PF no Tesouro Gerencial."
      - name: pf_inscricao
        description: "Inscricao/numero associado a PF no Tesouro."
      - name: pf_acao
        description: "Codigo da acao vinculada a PF no Tesouro."
      - name: pf_acao_descricao
        description: "Descricao da acao vinculada a PF no Tesouro."
      - name: pf_fonte_recursos
        description: "Codigo da fonte de recursos da PF no Tesouro."
      - name: pf_fonte_recursos_descricao
        description: "Descricao da fonte de recursos da PF no Tesouro."
      - name: doc_observacao
        description: "Observacao textual do documento no Tesouro."
      - name: pf_valor_linha
        description: "Valor financeiro da linha da PF no Tesouro."
      - name: id_programacao
        description: "Identificador da programacao financeira no Transferegov."
      - name: id_plano_acao
        description: "Identificador do plano de acao no Transferegov."
      - name: tp_pf_tipo_programacao
        description: "Tipo da programacao financeira no Transferegov."
      - name: tx_minuta_programacao
        description: "Numero/texto da minuta de programacao no Transferegov."
      - name: tx_numero_programacao
        description: "Numero da programacao financeira no Transferegov."
      - name: tx_situacao_programacao
        description: "Situacao da programacao financeira no Transferegov."
      - name: tx_observacao_programacao
        description: "Observacao/objeto da programacao no Transferegov."
      - name: ug_emitente_programacao
        description: "Codigo da UG emitente da programacao no Transferegov."
      - name: ug_favorecida_programacao
        description: "Codigo da UG favorecida da programacao no Transferegov."
      - name: dh_recebimento_programacao
        description: "Timestamp de recebimento/cadastro da programacao no Transferegov."
      - name: pf_chave
        description: "Chave normalizada usada no join entre Tesouro e Transferegov."
      - name: dt_ingest
        description: "Maior timestamp de ingestao entre as fontes (UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado'
          nome_coluna: 'emissao_dia'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado'
          nome_coluna: 'pf_valor_linha'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado'
          nome_coluna: 'id_programacao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado'
          nome_coluna: 'id_plano_acao'
          tipo_esperado: 'integer'

  - name: pf_unificado_planos_acao
    description: >
      Tabela silver que enriquece a base pf_unificado com os dados de planos de acao
      do Transferegov, por meio do id_plano_acao. O cruzamento preserva todas as
      linhas de PF e deduplica planos de acao por id_plano_acao, mantendo o registro
      mais recente por dt_ingest.
    columns:
      - name: id_programacao
        description: "Identificador da programacao financeira no Transferegov."
      - name: id_plano_acao
        description: "Identificador do plano de acao usado como chave de cruzamento."
      - name: id_programa
        description: "Identificador do programa associado ao plano de acao."
      - name: pf
        description: "Identificador completo da programacao financeira no Tesouro."
      - name: tx_numero_programacao
        description: "Numero da programacao financeira no Transferegov."
      - name: tx_situacao_plano_acao
        description: "Situacao do plano de acao no Transferegov."
      - name: vl_total_plano_acao
        description: "Valor total informado para o plano de acao."
      - name: dt_ingest
        description: "Maior timestamp de ingestao entre pf_unificado e ted_plano_acao_consolidado."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado_planos_acao'
          nome_coluna: 'id_programacao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado_planos_acao'
          nome_coluna: 'id_plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado_planos_acao'
          nome_coluna: 'id_programa'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.pf_unificado_planos_acao'
          nome_coluna: 'vl_total_plano_acao'
          tipo_esperado: 'numeric'
          
  - name: nc_unificado
    description: >
      Tabela silver que parte da nc_tesouro_mir e enriquece os campos de programa e ação
      com mapeamento por PTRES (programa_por_ptres/pf_ptres).
      O modelo mantém o layout principal de NC do SIAFI e aplica COALESCE para preencher
      programa_governo, programa_governo_descricao, acao_governo e acao_governo_descricao
      quando estiverem ausentes na base original.
    columns:
      - name: programa_governo
        description: "Código do programa de governo (SIAFI com fallback do mapeamento por PTRES)."
      - name: programa_governo_descricao
        description: "Descrição do programa de governo (SIAFI com fallback do mapeamento por PTRES)."
      - name: acao_governo
        description: "Código da ação de governo (SIAFI com fallback do mapeamento por PTRES)."
      - name: acao_governo_descricao
        description: "Descrição da ação de governo (SIAFI com fallback do mapeamento por PTRES)."
      - name: nc
        description: "Número identificador da Nota de Crédito (NC)."
      - name: nc_transferencia
        description: "Número/identificador de transferência da NC."
      - name: nc_fonte_recursos
        description: "Código da fonte de recursos."
      - name: nc_fonte_recursos_descricao
        description: "Descrição da fonte de recursos."
      - name: ptres
        description: "Programa de Trabalho Resumido (PTRES) no SIAFI."
      - name: nc_evento_descricao
        description: "Tipo da operação (DESCENTRALIZACAO, ANULACAO ou DEVOLUCAO DE DESCENTRALIZACAO DE CREDITO)."
      - name: nc_ug_responsavel
        description: "Código da UG responsável."
      - name: nc_ug_responsavel_descricao
        description: "Nome da UG responsável."
      - name: nc_natureza_despesa
        description: "Código da natureza de despesa."
      - name: nc_natureza_despesa_descricao
        description: "Descrição da natureza de despesa."
      - name: nc_plano_interno
        description: "Código do plano interno."
      - name: nc_plano_interno_descricao1
        description: "Descrição 1 do plano interno."
      - name: favorecido_doc
        description: "Documento (CPF/CNPJ) do favorecido."
      - name: favorecido_doc_descricao
        description: "Nome/razão social do favorecido."
      - name: favorecido_municipio
        description: "Código do município do favorecido."
      - name: favorecido_municipio_descricao
        description: "Descrição do município do favorecido."
      - name: valor_celula
        description: "Valor do movimento, sempre positivo (o sentido está em nc_evento_descricao)."
      - name: movimento_liquido_moeda_origem
        description: "Valor com sinal do ponto de vista do MIR: descentralização +, anulação e devolução -."
      - name: descricao
        description: "Descrição geral da NC (quando disponível)."
      - name: emissao_dia
        description: "Data de emissão da Nota de Crédito (SIAFI, quando disponível)."
      - name: emissao_ano
        description: "Ano da NC (do número)."
      - name: dc
        description: "Lado da célula (DESTINO). Somente dados pós-2026."
      - name: relatorio
        description: "enviadas (emitente MIR) ou recebidas (favorecido MIR)."
      - name: ug_emitente
        description: "UG emitente da NC (6 primeiros dígitos do número)."
      - name: ug_emitente_descricao
        description: "Nome da UG emitente. Só a partir de 2026."
      - name: dt_ingest
        description: "Timestamp de ingestão do SIAFI (UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_unificado'
          nome_coluna: 'valor_celula'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_unificado'
          nome_coluna: 'emissao_dia'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_unificado'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'

  - name: nc_plano_acao
    description: >
      Tabela silver que parte de nc_unificado e enriquece com o identificador do Plano de Ação
      do TransfereGov (id_plano_acao) via a ponte num_transf_n_plano_acao (nc_transferencia -> plano_acao).
      Filtra registros com nc_transferencia = '-8' (NCs sem vínculo de transferência válido).
      Retorna todas as colunas de nc_unificado acrescidas de id_plano_acao, que pode ser nulo
      quando a NC do SIAFI não possui correspondência no TransfereGov.
    columns:
      - name: id_plano_acao
        description: >
          Identificador do Plano de Ação no TransfereGov (integer), obtido via ponte
          num_transf_n_plano_acao pelo nc_transferencia. Nulo quando a NC não possui
          correspondência no TransfereGov.
      - name: programa_governo
        description: "Código do programa de governo (SIAFI até 2025; pelo PTRES a partir de 2026 e como fallback em nc_unificado)."
      - name: programa_governo_descricao
        description: "Descrição do programa de governo (SIAFI até 2025; pelo PTRES a partir de 2026 e como fallback em nc_unificado)."
      - name: acao_governo
        description: "Código da ação de governo (SIAFI até 2025; pelo PTRES a partir de 2026 e como fallback em nc_unificado)."
      - name: acao_governo_descricao
        description: "Descrição da ação de governo (SIAFI até 2025; pelo PTRES a partir de 2026 e como fallback em nc_unificado)."
      - name: nc
        description: "Número completo da Nota de Crédito no SIAFI. Primeiros 6 dígitos = UG emitente; últimos 12 = identificador da NC."
      - name: nc_transferencia
        description: "Número da transferência TED associado à NC — chave de ligação com a ponte num_transf_n_plano_acao."
      - name: nc_fonte_recursos
        description: "Código da fonte de recursos da NC (pré-2026: nc_fonte_recursos; pós-2026: fonte_codigo)."
      - name: nc_fonte_recursos_descricao
        description: "Descrição da fonte de recursos (pré-2026: nc_fonte_recursos_descricao; pós-2026: fonte_nome)."
      - name: ptres
        description: "Programa de Trabalho Resumido (PTRES) vinculado à NC no SIAFI."
      - name: nc_evento_descricao
        description: "Tipo da operação (DESCENTRALIZACAO, ANULACAO ou DEVOLUCAO DE DESCENTRALIZACAO DE CREDITO). Pré-2026: derivado do sinal e do relatório; pós-2026: tipo_nc. Usado no gold para classificar orcamento_recebido/devolvido."
      - name: nc_ug_responsavel
        description: "Código da UG responsável pela NC (pós-2026: ugr_codigo)."
      - name: nc_ug_responsavel_descricao
        description: "Nome da UG responsável (pós-2026: ugr_nome)."
      - name: nc_natureza_despesa
        description: "Código da natureza de despesa."
      - name: nc_natureza_despesa_descricao
        description: "Descrição da natureza de despesa."
      - name: nc_plano_interno
        description: "Código do plano interno da NC (pré-2026: nc_plano_interno; pós-2026: pi_codigo)."
      - name: nc_plano_interno_descricao1
        description: "Descrição principal do plano interno (pré-2026: nc_plano_interno_descricao1; pós-2026: pi_nome)."
      - name: favorecido_doc
        description: "CPF/CNPJ do favorecido (pré-2026: favorecido_doc; pós-2026: favorecido_codigo)."
      - name: favorecido_doc_descricao
        description: "Nome ou razão social do favorecido (pré-2026: favorecido_doc_descricao; pós-2026: favorecido_nome)."
      - name: favorecido_municipio
        description: "Código do município do favorecido. Somente dados pré-2026; nulo para pós-2026."
      - name: favorecido_municipio_descricao
        description: "Nome do município do favorecido. Somente dados pré-2026; nulo para pós-2026."
      - name: valor_celula
        description: "Valor do movimento, sempre positivo (o sentido está em nc_evento_descricao)."
      - name: movimento_liquido_moeda_origem
        description: "Valor com sinal do ponto de vista do MIR: descentralização +, anulação e devolução -."
      - name: descricao
        description: "Descrição geral da NC. Somente dados pós-2026; nulo para pré-2026."
      - name: emissao_dia
        description: "Data de emissão da NC. Somente dados pós-2026; nulo para pré-2026."
      - name: emissao_ano
        description: "Ano da NC (do número)."
      - name: dc
        description: "Lado da célula (DESTINO). Somente dados pós-2026; nulo para pré-2026."
      - name: relatorio
        description: "enviadas (emitente MIR) ou recebidas (favorecido MIR)."
      - name: ug_emitente
        description: "UG emitente da NC (6 primeiros dígitos do número)."
      - name: ug_emitente_descricao
        description: "Nome da UG emitente. Só a partir de 2026."
      - name: dt_ingest
        description: "Timestamp de ingestão do SIAFI (timestamptz, UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_plano_acao'
          nome_coluna: 'id_plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_plano_acao'
          nome_coluna: 'valor_celula'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_plano_acao'
          nome_coluna: 'emissao_dia'
          tipo_esperado: 'date'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.nc_plano_acao'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'

  - name: empenhos_por_plano_acao
    description: >
      NOTA (issue #508): a cascata de extração de num_transf foi movida para
      empenhos_ted_cascata (ephemeral, nenhuma linha descartada). Este modelo aplica sobre
      ela o filtro de vínculo e resolve o plano de ação — a saída é a mesma de antes do
      split. O filtro elimina linhas: quem chega sem nc, sem num_transf e sem o rótulo de
      exclusão SICONV não entra aqui nem em nada a jusante. O complemento exato desse
      filtro, categorizado por motivo, está em empenhos_ted_residuo; a contabilidade
      fechada de para onde vai cada real está em ted_auditoria_cascata.
      Tabela silver que vincula as Notas de Empenho do SIAFI aos Planos de Ação do TransfereGov.
      O vínculo é desafiador porque a NE não possui um campo estruturado para o número de
      transferência — ele está embutido no campo livre ne_ccor_descricao ou em campos auxiliares.
      O modelo aplica 9 métodos sequenciais de extração via regex, processando cada NE apenas
      uma vez pelo primeiro método que obtiver resultado. Como rede de segurança final (issue
      #510), qualquer num_transf extraído — de qualquer método — que exista no cadastro do
      SICONV (siconv_dbt.convenio ou termo_fomento_consolidado) é descartado: TED e SICONV
      nunca compartilham faixa de numeração, então a presença no cadastro prova que não é um
      TED, mesmo quando a NE não cita "CONVENIO"/"FOMENTO"/"SICONV" na própria linha (ver
      excluir_se do método 5 em regex_vinculo.sql para a primeira camada, por palavra-chave).
      Ao final, cruza o num_transf encontrado com a view num_transf_n_plano_acao para obter o
      plano_acao correspondente.
    columns:
      - name: emissao_mes
        description: "Mês de emissão da NE no SIAFI"
      - name: emissao_dia
        description: "Data de emissão da NE no SIAFI"
      - name: ne_ccor
        description: "Chave completa da Nota de Empenho no SIAFI"
      - name: ug_responsavel_codigo
        description: "Código da Unidade Gestora (UG) responsável pela NE."
      - name: ug_responsavel_nome
        description: "Nome da Unidade Gestora (UG) responsável pela NE."
      - name: plano_orcamentario_codigo_uo
        description: "Código da Unidade Orçamentária (UO) na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_funcao
        description: "Código da função de governo na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_subfuncao
        description: "Código da subfunção de governo na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_programa
        description: "Código do programa na classificação do plano orçamentário."
      - name: plano_orcamentario_codigo_acao
        description: "Código da ação na classificação do plano orçamentário."
      - name: ne_num_processo
        description: "Número do processo administrativo associado à NE, limpo de pontos, barras e hifens."
      - name: ne_info_complementar
        description: "Campo complementar da NE. Usado pelo método 5 de extração: quando contém exatamente 6 dígitos ou padrão 1XXXXX, é tratado como num_transf."
      - name: ne_ccor_descricao
        description: "Descrição livre da NE — campo principal de onde os métodos 1 a 5 e 7 extraem o num_transf via regex."
      - name: doc_observacao
        description: "Campo de observação do documento associado à NE. Usado pelo método 8 de extração via padrão 'TED NNN/AAAA'."
      - name: natureza_despesa
        description: "Código da natureza de despesa da NE (ex: 339030)."
      - name: natureza_despesa_descricao
        description: "Descrição da natureza de despesa da NE."
      - name: ne_ccor_favorecido
        description: "CNPJ ou CPF do favorecido do empenho, padronizado em maiúsculas."
      - name: ne_ccor_favorecido_descricao
        description: "Nome ou razão social do favorecido da NE."
      - name: ne_ccor_ano_emissao
        description: "Ano de emissão da NE (integer, YYYY), validado via regex para garantir 4 dígitos numéricos."
      - name: ptres
        description: "Programa de Trabalho Resumido (PTRES) vinculado à NE no SIAFI."
      - name: fonte_recursos_detalhada
        description: "Código detalhado da fonte de recursos da NE."
      - name: fonte_recursos_detalhada_descricao
        description: "Descrição da fonte de recursos. Usado pelo método 4 de extração do num_transf via regex no padrão 'TED: NNNNNN'."
      - name: despesas_empenhadas
        description: "Valor empenhado da NE (numeric 15,2). Positivo = novo empenho; negativo = anulação de empenho."
      - name: despesas_liquidadas
        description: "Valor liquidado (numeric 15,2) — despesas com bens ou serviços confirmados como entregues."
      - name: despesas_pagas
        description: "Valor efetivamente pago no exercício corrente (numeric 15,2)."
      - name: restos_a_pagar_inscritos
        description: "Valor inscrito em Restos a Pagar (numeric 15,2) — empenhado e não pago até o encerramento do exercício."
      - name: restos_a_pagar_pagos
        description: "Valor de Restos a Pagar efetivamente quitado (numeric 15,2)."
      - name: dt_ingest
        description: "Timestamp de ingestão da NE no SIAFI (timestamptz, UTC-3)."
      - name: ne
        description: "Identificador curto da Nota de Empenho — últimos 12 caracteres de ne_ccor."
      - name: orgao_id
        description: "Código do órgão emitente da NE — primeiros 6 caracteres de ne_ccor."
      - name: nc
        description: "Número da Nota de Crédito associada à NE, extraído de ne_ccor_descricao via regex e formatado pela UDF format_nc."
      - name: num_transf
        description: "Número da transferência TED extraído da NE pelos métodos 1 a 9 ou pela página do gov.br. Chave de ligação com a ponte num_transf_n_plano_acao."
      - name: metodo
        description: >
          Identifica qual método resolveu o vínculo da NE. Valores possíveis:
          'sem vinculo' (NEs com TED explícito sem número), 'metodo 1' a 'metodo 9',
          'pagina gov.br: TED NN/AAAA' (NE que a cascata não ligou a um plano, resolvida
          pelo número/ano do TED na página do gov.br, só se a UG da NE recebeu crédito
          do plano), 'ted ou nc invalido', 'vinculo nao encontrado' (sem vínculo
          identificado) e 'excluido: numero e de convenio/termo de fomento (SICONV)'
          (num_transf descartado na rede de segurança final por existir no cadastro do
          SICONV — issue #510).
      - name: complemento_ted
        description: "Complemento textual do TED extraído antes do número (ex: nome do programa), produzido pelos métodos 7 e 8."
      - name: num_ted
        description: "Número bruto do TED extraído do campo de texto pelos métodos 7 e 8, antes da normalização de ano."
      - name: metodo_ted
        description: "Indica a origem do numero_ted_normalizado: 'metodo 1' (ne_ccor_descricao) ou 'metodo 2' (doc_observacao)."
      - name: numero_base
        description: "Parte numérica do TED sem o ano, extraída de num_ted para o processo de normalização."
      - name: ano_raw
        description: "Ano bruto extraído de num_ted antes da normalização (pode ser 2 ou 4 dígitos)."
      - name: ano_normalizado
        description: "Ano com 4 dígitos após normalização: anos de 2 dígitos <= 30 viram '20XX'; > 30 viram '19XX'."
      - name: ano_oficial
        description: "Ano mais recente observado para o mesmo (orgao_id, numero_base), usado para preencher NEs sem ano explícito."
      - name: numero_ted_normalizado
        description: "Número do TED no formato canônico 'numero_base/ano_oficial' (ex: '42/2024'). Nulo quando nenhum ano pôde ser determinado com numero_base curto (<= 2 dígitos)."
      - name: plano_acao
        description: "Identificador do Plano de Ação no TransfereGov (integer), obtido via ponte num_transf_n_plano_acao a partir do num_transf. Nulo para NEs sem correspondência."
      - name: num_transf_pa
        description: "num_transf conforme registrado na ponte num_transf_n_plano_acao — usado para conferência cruzada com o num_transf extraído da NE."
      - name: ug_responsavel_codigo
        description: "Código da Unidade Gestora (UG) responsável pela execução do empenho."

      - name: ug_responsavel_nome
        description: "Nome da Unidade Gestora (UG) responsável pela execução do empenho."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'despesas_empenhadas'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'despesas_liquidadas'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'restos_a_pagar_inscritos'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'ne_ccor_ano_emissao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'plano_acao'
          tipo_esperado: 'integer'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.empenhos_por_plano_acao'
          nome_coluna: 'dt_ingest'
          tipo_esperado: 'timestamp with time zone'

  - name: tedinhos_mir
    description: >
      Detecção de "tedinhos" (issue #507) a partir da própria Nota de Crédito do SIAFI —
      nc_tesouro_mir.nc_evento_descricao = 'DESCENTRALIZACAO DE CREDITO' — em vez de regex
      sobre texto de NE. Só considera relatorio = 'enviadas' (MIR descentralizando); o lado
      'recebidas' é o MIR executando crédito de outro órgão, categoria diferente, fora do
      escopo da issue.
      Chave de instrumento (instrumento_key), em ordem de preferência: (1) nc_transferencia
      quando já atribuído (!= '-8') — existe em TODOS os anos, 2023-2026, é a chave
      universal; (2) processo, extraído do texto de descricao — só existe no relatório
      pós-2026 (o relatório "até 2025" não tem esse campo de texto livre); (3) a própria NC
      — fallback de último caso, nunca funde instrumentos diferentes por falta de
      identificador comum. nc_transferencia = '-8' isoladamente NÃO identifica um
      instrumento: é um estado transitório que até um TED formal carrega na sua primeira NC
      antes do SIAFI preencher o número definitivo (observado: TED 17/2026 UFF, processo
      21290.001965/2026-19, Transferegov 7AAFDT, apareceu com '-8' na NC inicial). A regra
      correta é pegar o nc_transferencia mais recente por instrumento — uma descentralização
      pode ser anulada e reemitida com um código novo, caso observado em MIR x UFF/CERD,
      processo 21290.000127/2026-28, que saiu de '-8' para '1ABDUQ' após reemissão — e
      cruzar com ted_plano_acao_consolidado.sq_instrumento (fonte nova do PR #75: portal do
      sistema TED + página de transparência do gov.br + dados abertos como reserva — cobre
      mais instrumentos conhecidos que a fonte antiga). Mesmo assim o texto da NC às vezes
      já cita o código TED antes do campo estruturado ser atualizado — por isso o modelo
      também extrai qualquer código citado em codigo_mencionado_no_texto; um instrumento só
      é classificado como tedinho forte (tedinho_provavel) quando os dois sinais concordam:
      não registrado no TransfereGov E nenhum código citado em lugar nenhum do texto.
      Serviço administrativo não é tedinho: o instrumento com alguma NC para UG de serviço
      compartilhado (CSC/MGI, Diárias e Passagens, Central de Compras, logística do MDHC) ou
      numa ação administrativa fica com servico_administrativo = true e tedinho_provavel =
      false. A lista é a das macros ted_execucao_ugs_excluidas/acoes_excluidas (o recorte da
      consulta oficial "Execução TED por UG"), e era ~95% do crédito classificado como
      tedinho antes da regra.
      Grão: uma linha por NC com evento de descentralização de crédito (não por instrumento —
      um instrumento pode ter várias NCs ao longo do tempo, incluindo anulações/reemissões).
      Alimenta ted_resumo_orcamentario como tipo_instrumento = 'Tedinho' (decisão de negócio:
      instrumento próprio, não somado ao TED pai).
    columns:
      - name: nc
        description: "Chave da Nota de Crédito no SIAFI."
      - name: instrumento_key
        description: >
          Chave de agrupamento do instrumento: 'transf:<código>' quando nc_transferencia já
          foi atribuído, senão 'proc:<processo>' (só 2026+), senão 'nc:<nc>' como último
          recurso. Usada para agrupar NCs do mesmo instrumento ao longo do tempo — não é
          para exibição direta.
      - name: processo
        description: >
          Número do processo administrativo (SEI) do MIR extraído por regex do texto de
          descricao (formato 21290.NNNNNN/AAAA-NN — restrito ao prefixo 21290, o órgão SEI
          do MIR, para não capturar processo de outro órgão citado na mesma NC, ex: da
          instituição favorecida). Nulo quando a NC não cita um processo do MIR no texto
          (sempre nulo para NCs do relatório até 2025).
      - name: nc_ug_responsavel
        description: "Código da UG responsável pela NC."
      - name: nc_ug_responsavel_descricao
        description: "Nome da UG responsável pela NC."
      - name: favorecido_doc
        description: "UG favorecida da NC — quem recebe o crédito."
      - name: acao_governo
        description: "Ação orçamentária da célula da NC."
      - name: valor_celula
        description: "Valor financeiro da NC (numeric 15,2)."
      - name: nc_evento_descricao
        description: "Descrição do evento contábil — sempre contém 'DESCENTRALIZACAO DE CREDITO' neste modelo."
      - name: nc_transferencia
        description: "Valor de nc_transferencia nesta NC específica — pode ser '-8' mesmo para um instrumento que depois vira TED formal."
      - name: nc_transferencia_atual
        description: >
          nc_transferencia mais recente para este instrumento (entre todas as NCs do mesmo
          instrumento_key, por emissao_dia desc). É este valor, não nc_transferencia da
          linha, que deve ser usado para classificar o instrumento.
      - name: codigo_mencionado_no_texto
        description: >
          Qualquer código tipo TED citado no texto de descricao de alguma NC do mesmo
          instrumento (padrões "TED <código>" ou "...DESCENTRALIZADA Nº <código>"), mesmo
          que nc_transferencia ainda esteja '-8'. Não nulo aqui geralmente indica um TED
          normal em trânsito, não um tedinho — ver caso TED 17/2026 UFF na descrição do modelo.
      - name: registrado_no_transferegov
        description: >
          true quando nc_transferencia_atual existe em
          ted_plano_acao_consolidado.sq_instrumento — ou seja, o instrumento tem um plano
          formal no TransfereGov.
        tests:
          - not_null
      - name: servico_administrativo
        description: >
          true quando o instrumento paga a operação do próprio MIR, não um parceiro: alguma
          linha dele tem o favorecido em ted_execucao_ugs_excluidas() ou a ação em
          ted_execucao_acoes_excluidas() (macros/mir_silver/ted_execucao_instrumento.sql — o
          recorte da consulta oficial "Execução TED por UG"; hoje dispara pelo CSC/MGI, Diárias
          e Passagens, Central de Compras, logística do MDHC e ação 2000). É do instrumento, não
          da linha: basta uma linha administrativa para o instrumento inteiro sair, para não
          entrar crédito pela metade num instrumento misto.
        tests:
          - not_null
      - name: tedinho_provavel
        description: >
          true quando o instrumento NÃO está registrado no TransfereGov, nenhum código TED
          foi citado em nenhuma NC dele, em lugar nenhum, e a linha não é serviço
          administrativo — o sinal mais forte de tedinho genuíno que dá para derivar só do
          SIAFI. false inclui instrumentos formais, TEDs normais ainda em trânsito
          (nc_transferencia desatualizado mas já com código citado no texto) e serviço
          administrativo.
        tests:
          - not_null
      - name: emissao_dia
        description: "Data de emissão da NC (date)."
      - name: dt_ingest
        description: "Timestamp de ingestão da NC no SIAFI (UTC-3)."
    tests:
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.tedinhos_mir'
          nome_coluna: 'valor_celula'
          tipo_esperado: 'numeric'
      - verificacao_tipagem:
          nome_tabela: 'siafi_dbt.tedinhos_mir'
          nome_coluna: 'emissao_dia'
          tipo_esperado: 'date'

  - name: empenhos_ted_cascata
    description: >
      Cascata completa de extração de num_transf, sem nenhum descarte: toda NE de
      ppa_tesouro (exceto as linhas de dotação, ne_ccor = '-9', que não são NE) sai aqui
      com o rótulo do método que a resolveu — ou com metodo = 'vinculo nao encontrado'
      quando nenhum resolveu, ou com o rótulo de exclusão SICONV da issue #510.
      Issue #508: antes a cascata e o filtro de vínculo viviam no mesmo modelo, então a NE
      sem vínculo era eliminada sem deixar rastro e a diferença entre o painel e o
      levantamento da CGPO não era mensurável. Separando os dois, o descarte virou um passo
      explícito: empenhos_por_plano_acao aplica o filtro (o que chega na gold) e
      empenhos_ted_residuo guarda o complemento, categorizado por motivo.
      É `ephemeral` de propósito — não vira tabela no banco, o dbt a inlina como CTE em
      cada consumidor. Nada novo para entregar; o custo é calcular a cascata duas vezes por
      run. Se isso passar a pesar, trocar para materialized="table" basta, sem mudar os
      consumidores.
      ATENÇÃO ao escopo: o modelo é de governo inteiro, não só do MIR — ne_tesouro_ppa traz
      as NEs de todos os órgãos por desenho, porque o TED é empenhado pelo órgão RECEBEDOR.
      A maior parte das linhas aqui é orçamento próprio de outras UGs. Não use este modelo
      para somar valores do MIR; use empenhos_por_plano_acao ou a gold.

  - name: empenhos_ted_residuo
    description: >
      O resíduo da cascata: as NEs que NÃO contribuem com empenhado para o painel de TED,
      cada uma com o motivo. Issue #508, tarefas de auditoria do resíduo. O critério
      reproduz exatamente a condição que a gold usa para somar empenhado
      (valores_empenhados_tb): fica aqui a NE com num_transf nulo OU cujo num_transf
      canonicalize para vazio. A segunda metade importa — um num_transf de zeros ('0',
      '000000') é não nulo mas é descartado pela gold, então a NE não vira empenhado no
      painel e é resíduo. Usar só `is null` a deixaria invisível aqui e contada como
      painel na auditoria, que é a lacuna que esta issue existe para fechar.
      Mesmo escopo de governo inteiro de empenhos_ted_cascata: a categoria
      'a_sem_mencao_ted' domina em volume e é esperada — é o orçamento próprio das outras
      UGs, não perda do MIR. O que interessa para a reconciliação com a CGPO são as
      categorias 'b' e 'c'; 'e' mede o conserto da issue #510 em funcionamento.
    columns:
      - name: ne_ccor
        description: "Chave completa da Nota de Empenho no SIAFI."
      - name: categoria_residuo
        description: >
          Motivo do descarte, com precedência e > d > c > b > a:
          'e_excluido_siconv' (o número existe no cadastro do SICONV, então não é TED —
          Convênio/Termo de Fomento descartado de propósito pela rede de segurança da
          cascata, issue #510; NÃO é perda, é o conserto do bucket "Em Branco" funcionando.
          Precede as demais porque uma dessas NEs pode também ter NC e seria rotulada 'c');
          'd_ted_sem_vinculo' (a NE declara "TED S/V"/"sem vínculo" — resíduo legítimo);
          'c_nc_sem_transferencia' (tem NC, mas a NC não resolve transferência);
          'b_menciona_ted_sem_captura' (o texto menciona TED/transferência num formato que
          nenhum regex capturou — é desta categoria que sairiam novos métodos);
          'a_sem_mencao_ted' (nenhuma menção a TED em nenhum campo lido pela cascata).
        tests:
          - not_null
          - accepted_values:
              values:
                - 'a_sem_mencao_ted'
                - 'b_menciona_ted_sem_captura'
                - 'c_nc_sem_transferencia'
                - 'd_ted_sem_vinculo'
                - 'e_excluido_siconv'
      - name: descartado_em
        description: >
          Em qual filtro a linha morreu. 'silver' = o filtro de vínculo de
          empenhos_por_plano_acao a elimina do modelo. 'gold' = sobreviveu à silver (tem NC,
          ou é exclusão SICONV rotulada) mas o `where num_transf is not null` de
          valores_empenhados_tb a deixa fora do somatório de empenhado.
        tests:
          - not_null
          - accepted_values:
              values: ['silver', 'gold']
      - name: menciona_ted
        description: >
          true quando algum dos campos de texto lidos pela cascata menciona TED,
          TransfereGov, descentralização, termo de execução, nota de transferência ou NT.
          Checagem deliberadamente mais larga que os regex de captura: separa "o número não
          está escrito" de "o número está escrito num formato que o regex não pega".
        tests:
          - not_null
      - name: num_transf
        description: >
          Nulo na maioria dos casos. Pode vir preenchido quando canonicaliza para vazio
          (zeros), situação em que a gold o descarta e a NE é resíduo apesar de ter valor.
          Mantido para conferência.
      - name: metodo_familia
        description: >
          Família do método, estável para agregação: a parte do metodo antes do primeiro
          ':'. Os métodos 'pagina gov.br' e 'empenho de origem' embutem o número do TED e a
          NE de origem na própria string de metodo, então agrupar pelo metodo cru
          fragmentaria qualquer relatório em grupos quase individuais. É esta coluna que
          ted_auditoria_cascata agrega; metodo continua disponível para drill-down.
        tests:
          - not_null
      - name: despesas_empenhadas
        description: "Valor empenhado da NE. Positivo é empenho, negativo é anulação."
      - name: despesas_liquidadas
        description: "Valor liquidado da NE."
      - name: despesas_pagas
        description: "Valor pago da NE no exercício."

  - name: execucao_ted_ne
    description: >
      Base de NEs da execução dos TEDs por instrumento: as NEs de ppa_tesouro recortadas
      como a consulta oficial "Execução TED por UG" (execucao_ted_ug): resultado EOF 2, sem
      as UGs e ações que a consulta não traz. Porta a seção "base" de
      analises/ted_execucao/pipeline.py. Grão: uma linha por NE (cada NE cai numa única
      célula ano x UG x ação x PO x PTRES x grupo x fonte). A var
      ted_execucao_corte_emissao corta as NEs emitidas depois da data de posição da
      consulta oficial, quando as duas extrações não são do mesmo dia.
    columns:
      - name: ne_ccor
        description: "NE (UG + gestão + ano + número)."
        tests:
          - unique
          - not_null
      - name: ano
        description: "Ano de emissão da NE (exercício)."
      - name: ug
        description: "UG emitente da NE (6 primeiros caracteres de ne_ccor)."
      - name: orgao_ug
        description: "Órgão da UG na consulta oficial; nulo se a UG não está nela."
      - name: natureza_despesa
        description: "Natureza de despesa da NE (do cabeçalho da NE: um valor por NE)."
      - name: natureza_despesa_descricao
        description: "Descrição da natureza de despesa."
      - name: fonte_descricao
        description: "Descrição da fonte de recursos detalhada."
      - name: acao
        description: "Ação orçamentária."
      - name: po
        description: "Plano orçamentário."
      - name: ptres
        description: "PTRES."
      - name: grupo
        description: "Grupo de natureza de despesa."
      - name: fonte
        description: "Fonte de recursos detalhada."
      - name: celula_credito
        description: "Célula de crédito ano|órgão|PTRES|fonte, a chave das regras de crédito."
      - name: oficial
        description: "A célula da NE está na consulta oficial (só essas recebem instrumento)."
      - name: emp
        description: "Empenhado líquido da NE (anulações negativas)."
      - name: liq
        description: "Liquidado no exercício."
      - name: pag
        description: "Pago no exercício."
      - name: insc_rap
        description: >
          RAP inscrito no exercício seguinte ao da NE (o que passou para restos a
          pagar). As reinscrições dos exercícios seguintes não entram, porque repetem o
          saldo.
      - name: pag_rap
        description: "Restos a pagar pagos da NE, somados em todos os exercícios seguintes."
      - name: saldo_rap
        description: >
          RAP inscrito menos RAP pago no último exercício do relatório: o que falta
          pagar. Zero para NE do último exercício, que ainda não foi para restos a pagar.
      - name: tem_movimento
        description: "Alguma linha da NE tem empenhado, liquidado ou pago diferente de zero."
      - name: ne_ccor_descricao
        description: "Descrição da NE."
      - name: processo
        description: "Número do processo da NE, só dígitos (nulo quando não informado)."
      - name: favorecido
        description: "Nome do favorecido da NE."
      - name: texto
        description: >
          Descrição, informações complementares (todos os valores distintos) e observações
          dos documentos, em maiúsculas: o texto em que as regras procuram TED, NC, NE de
          referência, processo e contrato.

  - name: ted_tedinho_gov_br
    description: >
      Tedinhos (NC do MIR sem número de transferência) identificados na página de
      transferências voluntárias do MIR no gov.br, com o processo, o parceiro e o
      objeto da página. Porta analises/ted_execucao/govbr_pagina.py. A página não traz
      a NC: o vínculo é pelo valor, com NCs do ano da página (ou do seguinte) para o
      órgão do parceiro, e só quando é único (um instrumento com o valor exato ou um
      único par de NCs que soma o valor). Grão: uma linha por instrumento.
    columns:
      - name: instrumento
        description: "Instrumento de ted_credito_instrumento ('tedinho <NC>' ou NCs fundidas)."
        tests:
          - not_null
          - unique
      - name: nome_instrumento
        description: >
          "tedinho Processo 21290.../AAAA-xx (SIGLA)" ou, para TED da página sem número
          do Transferegov, "tedinho TED nn/AAAA (sem nº Transferegov) (SIGLA)".
      - name: tipo_entrada
        description: "'descentralização' ou 'TED sem nº Transferegov'."
      - name: numero_ted
        description: "Número/ano do TED na página (só em 'TED sem nº Transferegov')."
      - name: processo
        description: "Processo SEI na página."
      - name: parceiro
        description: "Parceiro como a página o nomeia."
      - name: parceiro_sigla
        description: "Sigla do parceiro (fim do nome na página), em maiúsculas."
      - name: objeto
        description: "Objeto da descentralização na página."
      - name: valor_pagina
        description: "Valor da descentralização na página."
      - name: metodo
        description: "'valor exato' ou 'par de NCs'."
      - name: pagina
        description: "Subpágina do gov.br."
      - name: url
        description: "Endereço da subpágina."

  - name: ted_credito_instrumento
    description: >
      Crédito descentralizado pelo MIR por instrumento, uma linha por movimento de NC, com
      a célula de crédito (ano x órgão x PTRES x fonte). Porta credito_total.py de
      analises/ted_execucao a partir de nc_tesouro_mir. origem 'TED': NC com número de
      transferência (campo, texto da NC ou processo com um único TED), sem as NCs internas
      do MIR, com o sinal do evento. origem 'tedinho': NC do MIR sem número para outro
      órgão; anulação e devolução abatem a NC que cancelam (estorno citado, itens
      idênticos ou mesmo valor total, cada NC uma vez só) e o cancela-e-relança vira um
      instrumento só ("NC_A / NC_B"). origem 'devolucao': devolução sem número; a que não
      abate nenhum tedinho fica como '(devolução sem TED)'.
    columns:
      - name: origem
        description: "'TED', 'tedinho' ou 'devolucao'."
        tests:
          - accepted_values:
              values: ["TED", "tedinho", "devolucao"]
      - name: tipo
        description: "Só para origem TED: Recebido, Devolvido ou Anulado (pelo evento da NC)."
      - name: num_transf
        description: "Só para origem TED: número de transferência do TED."
      - name: nc
        description: "NC do SIAFI."
      - name: ano
        description: "Ano do movimento (data de emissão ou, sem ela, ano do número da NC)."
      - name: ug
        description: "UG executora (o lado da NC que não é o MIR)."
      - name: orgao_ug
        description: "Órgão da UG na consulta oficial, ou 'UG <código>' se ela não está nela."
      - name: ptres
        description: "PTRES da NC."
      - name: fonte
        description: "Fonte de recursos da NC."
      - name: celula_credito
        description: "Célula de crédito ano|órgão|PTRES|fonte."
      - name: instrumento
        description: "Número do TED, 'tedinho <NC>' ou '(devolução sem TED)'."
      - name: valor
        description: "Valor com sinal: crédito positivo; anulação e devolução negativas."

  - name: execucao_ted_ne_regras
    description: >
      Camadas 1 e 2 da execução dos TEDs por instrumento (pipeline.py até o descarte por
      crédito). 1 cascata dbt (empenhos_por_plano_acao); para as NEs que ela não ligou, A1
      número do TransfereGov no texto, A2 numeração do MIR pela página do gov.br, D NC
      citada, e propagação por B NE de referência, C mesmo processo e E mesmo contrato, em
      rodadas fixas (var ted_execucao_rodadas). O TED precisa ser do órgão da NE e o
      candidato, único. Depois descarta o número que não é TED do MIR e o vínculo que
      contradiz o crédito da célula. Grão: uma linha por NE da consulta oficial.
    columns:
      - name: ne_ccor
        description: "NE."
        tests:
          - unique
          - not_null
      - name: instrumento_bruto
        description: "Instrumento antes dos descartes."
      - name: regra_bruta
        description: "Regra antes dos descartes."
      - name: instrumento
        description: "Instrumento depois dos descartes (nulo: vai para as regras de crédito)."
      - name: regra
        description: "Regra que ligou a NE."
      - name: rodada_propagacao
        description: "Rodada em que a propagação B/C/E ligou a NE (0 = primeira)."

  - name: execucao_ted_ne_vinculo
    description: >
      Atribuição final de cada NE da consulta oficial a um instrumento (TED ou tedinho).
      Sobre execucao_ted_ne_regras, aplica as regras de crédito e saldo de pipeline.py, na
      ordem: G1 crédito exclusivo, G2 saldo exato de um TED, G3 repasse por outro órgão,
      G1b crédito exclusivo descontado o repasse, G4/G5 saldo na célula, T NC do MIR
      citada (com cancela-e-relança), S subdescentralização, R saldo do intermediário,
      G3 repasse por exclusão e a segunda passada do saldo na célula (G6 conjunto aberto).
      Nada é rateado: o que nenhuma regra resolve fica como '6 não identificado'. Grão:
      uma linha por NE da consulta oficial.
    columns:
      - name: ne_ccor
        description: "NE."
        tests:
          - unique
          - not_null
      - name: celula_credito
        description: "Célula de crédito ano|órgão|PTRES|fonte da NE."
      - name: instrumento
        description: "Número do TED, 'tedinho <NC>' ou junção ('A + B'); nulo se não identificado."
      - name: tipo_instrumento
        description: "TED ou Tedinho."
      - name: regra
        description: "Regra que identificou o instrumento (rótulos de pipeline.py)."
      - name: grupo_regra
        description: "Camada da regra."
        tests:
          - accepted_values:
              values:
                - "1 cascata dbt"
                - "2 regras determinísticas"
                - "4 crédito da UG"
                - "5 tedinho / subdescentralização"
                - "6 não identificado"
      - name: modo_casamento
        description: "Para as regras de saldo: exato, grupo, subconjunto, exclusão, conjunto ou conjunto aberto."
      - name: rodada
        description: "Rodada da propagação ou do casamento de saldos que ligou a NE."
