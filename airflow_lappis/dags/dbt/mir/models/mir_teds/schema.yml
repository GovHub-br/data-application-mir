version: 2

models:
  - name: teds_dim_tempo
    description: "Calendario diario de 2000 a 2040 (macro compartilhada); sk_tempo = AAAAMMDD; -1 = sem data."
    columns:
      - name: sk_tempo
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_unidade_gestora
    description: "UG responsavel das NEs (macro compartilhada)."
    columns:
      - name: sk_unidade_gestora
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_acao_orcamentaria
    description: "Classificacao programatica no grao do PTRES (macro compartilhada)."
    columns:
      - name: sk_acao_orcamentaria
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_natureza_despesa
    description: "Natureza de despesa, GND e modalidade de aplicacao (macro compartilhada)."
    columns:
      - name: sk_natureza_despesa
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_fonte_recurso
    description: "Fonte de recursos detalhada (macro compartilhada)."
    columns:
      - name: sk_fonte_recurso
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_emenda
    description: "Emenda parlamentar (macro compartilhada)."
    columns:
      - name: sk_emenda
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_parlamentar
    description: >
      Parlamentar x cargo x partido (SCD2, macro compartilhada). As janelas
      podem se sobrepor entre partidos do mesmo parlamentar: para filtrar por
      data, use a fato, nao a dimensao.
    columns:
      - name: sk_parlamentar
        tests: [unique, not_null, membro_nao_identificado]

  - name: teds_dim_plano_acao
    description: >
      Planos de acao de TED do MIR (TransfereGov): plano, programa, origem do
      recurso e vigencia. vigente e calculado contra data_referencia (data da
      carga).
    columns:
      - name: sk_plano_acao
        tests: [unique, not_null, membro_nao_identificado]
      - name: id_plano_acao
        tests: [unique, not_null]
      - name: origem_recurso
        tests:
          - not_null
          - accepted_values:
              values: ["Emenda", "Recurso próprio", "Não identificada"]

  - name: teds_dim_unidade_executora
    description: "UGs que executam os TEDs (lado que nao e o MIR nas NCs e PFs)."
    columns:
      - name: sk_unidade_executora
        tests: [unique, not_null, membro_nao_identificado]
      - name: ug_executora_codigo
        tests: [unique, not_null]
