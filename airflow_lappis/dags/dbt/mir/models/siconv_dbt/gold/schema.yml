models:
- name: resumo_convenios
  description: >
    Tabela gold de convênios do MIR. Consolida em uma única linha por convênio
    todas as informações relevantes agregadas das tabelas do SICONV, incluindo
    execução financeira, metas físicas, licitações, pagamentos, aditivos e
    emendas parlamentares associadas.
  columns:
    - name: nr_convenio
      description: "Número único do convênio — chave principal."
    - name: modalidade_instrumento
      description: "Modalidade do instrumento: Convênio ou Termo de Fomento."
    - name: uf_execucao
      description: "UF onde o projeto será executado."
    - name: municipio_execucao
      description: "Município onde o projeto será executado."
    - name: nome_convenente
      description: "Nome do convenente — município, estado ou organização que vai executar o projeto."
    - name: categoria_convenente
      description: "Categoria do convenente: Administração Pública Municipal, Estadual, Organização da Sociedade Civil etc."
    - name: objeto
      description: "Descrição do objeto do convênio — o que será executado."
    - name: valor_firmado_atualizado
      description: "Valor global atual do convênio, já refletindo os termos aditivos."
    - name: valor_firmado_inicial
      description: "Valor global original do convênio antes de qualquer aditivo."
    - name: valor_repasse_previsto
      description: "Valor de repasse previsto pelo governo federal."
    - name: valor_repassado
      description: "Valor efetivamente repassado pelo governo federal até o momento."
    - name: saldo_disponivel
      description: "Saldo disponível na conta do convenente para gastar."
    - name: valor_contrapartida_previsto
      description: "Valor de contrapartida que o convenente deve aportar."
    - name: situacao_atual
      description: "Situação atual do convênio: Em execução, Aguardando Prestação de Contas etc."
    - name: data_assinatura
      description: "Data de assinatura do convênio."
    - name: inicio_vigencia
      description: "Data de início da vigência do convênio."
    - name: fim_vigencia
      description: "Data de fim da vigência do convênio."
    - name: prazo_vigente
      description: "Indica se o convênio ainda está dentro do prazo de vigência."
    - name: inadimplente
      description: "Indica se o convênio já esteve em situação de inadimplência."
    - name: rescindido
      description: "Indica se o convênio foi rescindido."
    - name: anulado
      description: "Indica se o convênio foi anulado."
    - name: quantidade_mudancas_situacao
      description: "Quantidade de vezes que o convênio mudou de situação."
    - name: valor_total_repassado
      description: "Soma dos desembolsos reais registrados na tabela de desembolso."
    - name: quantidade_desembolsos
      description: "Quantidade de desembolsos realizados."
    - name: data_ultimo_desembolso
      description: "Data do último desembolso realizado."
    - name: max_dias_sem_repasse
      description: "Maior período em dias sem receber repasse."
    - name: valor_empenhado
      description: "Valor total empenhado no SICONV."
    - name: quantidade_empenhos
      description: "Quantidade de empenhos associados ao convênio."
    - name: valor_total_pago
      description: "Valor total pago aos fornecedores."
    - name: quantidade_pagamentos
      description: "Quantidade de pagamentos realizados."
    - name: data_ultimo_pagamento
      description: "Data do último pagamento realizado."
    - name: valor_desbloqueado
      description: "Valor total desbloqueado pelo banco."
    - name: valor_bloqueado
      description: "Valor ainda bloqueado aguardando liberação."
    - name: data_ultimo_desbloqueio
      description: "Data do último desbloqueio."
    - name: valor_total_tributos
      description: "Valor total pago em tributos com recursos do convênio."
    - name: quantidade_pagamentos_tributo
      description: "Quantidade de pagamentos de tributos realizados."
    - name: valor_contrapartida_depositado
      description: "Valor total depositado de contrapartida pelo convenente."
    - name: quantidade_licitacoes
      description: "Quantidade de licitações realizadas no âmbito do convênio."
    - name: valor_total_contratado
      description: "Valor total contratado via licitações."
    - name: quantidade_metas
      description: "Quantidade de metas físicas previstas no convênio."
    - name: prazo_meta_expirado
      description: "Indica se o prazo de pelo menos uma meta física já expirou."
    - name: quantidade_aditivos
      description: "Quantidade de termos aditivos formalizados."
    - name: valor_total_aditivado
      description: "Valor total adicionado via termos aditivos."
    - name: novo_prazo_vigencia
      description: "Novo prazo de vigência definido pelo último termo aditivo."
    - name: quantidade_prorrogacoes
      description: "Quantidade de prorrogações de ofício por atraso do concedente."
    - name: total_dias_prorrogado
      description: "Total de dias que o convênio foi prorrogado por culpa do concedente."
    - name: quantidade_solicitacoes_alteracao
      description: "Quantidade de solicitações de alteração feitas pelo convenente."
    - name: valor_solicitado_rendimento_aplicacao
      description: "Valor total solicitado para uso dos rendimentos de aplicação."
    - name: valor_aprovado_rendimento_aplicacao
      description: "Valor total aprovado para uso dos rendimentos de aplicação."
    - name: valor_total_previsto
      description: "Valor total previsto no cronograma de desembolso."
    - name: valor_previsto_concedente
      description: "Valor previsto de repasse pelo concedente no cronograma."
    - name: valor_previsto_convenente
      description: "Valor previsto de aporte pelo convenente no cronograma."
    - name: valor_previsto_rendimento
      description: "Valor previsto de rendimento de aplicação no cronograma."
    - name: quantidade_parcelas
      description: "Quantidade de parcelas previstas no cronograma de desembolso."
    - name: parlamentares
      description: "Parlamentares que direcionaram emendas para este convênio. NULL se não há emenda associada."
    - name: partidos
      description: "Partidos dos parlamentares que direcionaram emendas. NULL se não há emenda associada."
    - name: ufs_parlamentares
      description: "UFs dos parlamentares que direcionaram emendas. NULL se não há emenda associada."
    - name: origem
      description: "Indica a origem do recurso: 'Emenda' se vinculado a uma emenda parlamentar, 'Recurso Próprio' caso contrário."
- name: resumo_termos_fomento
  description: >
    Tabela gold de termos de fomento do MIR. Consolida em uma única linha por
    termo de fomento todas as informações relevantes agregadas das tabelas do
    SICONV, incluindo execução financeira, metas físicas, licitações,
    pagamentos, aditivos e emendas parlamentares associadas. Segue a mesma
    estrutura e padrão de modelagem da tabela gold resumo_convenios, tendo
    como fonte a camada silver termo_fomento_consolidado.
  columns:
    - name: nr_convenio
      description: "Número único do termo de fomento — chave principal."
    - name: modalidade_instrumento
      description: "Modalidade do instrumento — sempre TERMO DE FOMENTO nesta tabela."
    - name: uf_execucao
      description: "UF onde o projeto será executado."
    - name: municipio_execucao
      description: "Município onde o projeto será executado."
    - name: nome_convenente
      description: "Nome do convenente — organização que vai executar o projeto."
    - name: categoria_convenente
      description: "Categoria do convenente: Organização da Sociedade Civil etc."
    - name: objeto
      description: "Descrição do objeto do termo de fomento — o que será executado."
    - name: valor_firmado_atualizado
      description: "Valor global atual do termo de fomento, já refletindo os termos aditivos."
    - name: valor_firmado_inicial
      description: "Valor global original do termo de fomento antes de qualquer aditivo."
    - name: valor_repasse_previsto
      description: "Valor de repasse previsto pelo governo federal."
    - name: valor_repassado
      description: "Valor efetivamente repassado pelo governo federal até o momento."
    - name: saldo_disponivel
      description: "Saldo disponível na conta do convenente para gastar."
    - name: valor_contrapartida_previsto
      description: "Valor de contrapartida que o convenente deve aportar."
    - name: situacao_atual
      description: "Situação atual do termo de fomento: Em execução, Aguardando Prestação de Contas etc."
    - name: data_assinatura
      description: "Data de assinatura do termo de fomento."
    - name: inicio_vigencia
      description: "Data de início da vigência do termo de fomento."
    - name: fim_vigencia
      description: "Data de fim da vigência do termo de fomento."
    - name: prazo_vigente
      description: "Indica se o termo de fomento ainda está dentro do prazo de vigência."
    - name: inadimplente
      description: "Indica se o termo de fomento já esteve em situação de inadimplência."
    - name: rescindido
      description: "Indica se o termo de fomento foi rescindido."
    - name: anulado
      description: "Indica se o termo de fomento foi anulado."
    - name: quantidade_mudancas_situacao
      description: "Quantidade de vezes que o termo de fomento mudou de situação."
    - name: valor_total_repassado
      description: "Soma dos desembolsos reais registrados na tabela de desembolso."
    - name: quantidade_desembolsos
      description: "Quantidade de desembolsos realizados."
    - name: data_ultimo_desembolso
      description: "Data do último desembolso realizado."
    - name: max_dias_sem_repasse
      description: "Maior período em dias sem receber repasse."
    - name: valor_empenhado
      description: "Valor total empenhado no SICONV."
    - name: quantidade_empenhos
      description: "Quantidade de empenhos associados ao termo de fomento."
    - name: valor_total_pago
      description: "Valor total pago aos fornecedores."
    - name: quantidade_pagamentos
      description: "Quantidade de pagamentos realizados."
    - name: data_ultimo_pagamento
      description: "Data do último pagamento realizado."
    - name: valor_desbloqueado
      description: "Valor total desbloqueado pelo banco."
    - name: valor_bloqueado
      description: "Valor ainda bloqueado aguardando liberação."
    - name: data_ultimo_desbloqueio
      description: "Data do último desbloqueio."
    - name: valor_total_tributos
      description: "Valor total pago em tributos com recursos do termo de fomento."
    - name: quantidade_pagamentos_tributo
      description: "Quantidade de pagamentos de tributos realizados."
    - name: valor_contrapartida_depositado
      description: "Valor total depositado de contrapartida pelo convenente."
    - name: quantidade_licitacoes
      description: "Quantidade de licitações realizadas no âmbito do termo de fomento."
    - name: valor_total_contratado
      description: "Valor total contratado via licitações."
    - name: quantidade_metas
      description: "Quantidade de metas físicas previstas no termo de fomento."
    - name: prazo_meta_expirado
      description: "Indica se o prazo de pelo menos uma meta física já expirou."
    - name: quantidade_aditivos
      description: "Quantidade de termos aditivos formalizados."
    - name: valor_total_aditivado
      description: "Valor total adicionado via termos aditivos."
    - name: novo_prazo_vigencia
      description: "Novo prazo de vigência definido pelo último termo aditivo."
    - name: quantidade_prorrogacoes
      description: "Quantidade de prorrogações de ofício por atraso do concedente."
    - name: total_dias_prorrogado
      description: "Total de dias que o termo de fomento foi prorrogado por culpa do concedente."
    - name: quantidade_solicitacoes_alteracao
      description: "Quantidade de solicitações de alteração feitas pelo convenente."
    - name: valor_solicitado_rendimento_aplicacao
      description: "Valor total solicitado para uso dos rendimentos de aplicação."
    - name: valor_aprovado_rendimento_aplicacao
      description: "Valor total aprovado para uso dos rendimentos de aplicação."
    - name: valor_total_previsto
      description: "Valor total previsto no cronograma de desembolso."
    - name: valor_previsto_concedente
      description: "Valor previsto de repasse pelo concedente no cronograma."
    - name: valor_previsto_convenente
      description: "Valor previsto de aporte pelo convenente no cronograma."
    - name: valor_previsto_rendimento
      description: "Valor previsto de rendimento de aplicação no cronograma."
    - name: quantidade_parcelas
      description: "Quantidade de parcelas previstas no cronograma de desembolso."
    - name: parlamentares
      description: "Parlamentares que direcionaram emendas para este termo de fomento. NULL se não há emenda associada."
    - name: partidos
      description: "Partidos dos parlamentares que direcionaram emendas. NULL se não há emenda associada."
    - name: ufs_parlamentares
      description: "UFs dos parlamentares que direcionaram emendas. NULL se não há emenda associada."
    - name: origem
      description: "Indica a origem do recurso: 'Emenda' se vinculado a uma emenda parlamentar, 'Recurso Próprio' caso contrário."

- name: emendas_instrumentos_execucao
  description: >
      Emendas parlamentares vinculadas a instrumentos de execução (convênio,
      termo de fomento, TED, etc.), com identificação padronizada do
      instrumento e seu tipo. Tem como base a tabela numero_transferencia,
      enriquecida com a modalidade da proposta (via convenios_consolidados),
      cruzamento com termo_fomento_consolidado, ted_resumo_orcamentario 
      e fallback por padrões de texto nos campos descritivos.
  columns:
      - name: emissao_mes
        description: "Mês de emissão do documento orçamentário/financeiro."
      - name: emissao_dia
        description: "Dia de emissão do documento orçamentário/financeiro."
      - name: codigo_programa
        description: "Código do programa orçamentário do governo ao qual a emenda está vinculada."
      - name: programa
        description: "Nome do programa orçamentário do governo."
      - name: codigo_acao_ajustada
        description: "Código da ação orçamentária ajustada vinculada à emenda."
      - name: acao_ajustada
        description: "Descrição da ação orçamentária ajustada."
      - name: autor_emendas_orcamento_descricao
        description: "Descrição textual associada ao código orçamentário da emenda."
      - name: autor_emendas_orcamento_nome
        description: "Nome associado ao código orçamentário da emenda."
      - name: localizador_gasto
        description: "Código do localizador de gasto do orçamento."
      - name: localizador_gasto_descricao
        description: "Descrição do localizador de gasto."
      - name: regiao_pt
        description: "Região do Plano de Trabalho de execução do recurso."
      - name: uf
        description: "UF de execução do recurso vinculada ao documento orçamentário."
      - name: uf_descricao
        description: "Descrição/nome por extenso da UF de execução."
      - name: municipio
        description: "Município de execução do recurso."
      - name: pais
        description: "País de execução do recurso (normalmente Brasil)."
      - name: ne_ccor
        description: "Código do centro de custo/órgão responsável associado à Nota de Empenho."
      - name: ne_num_processo
        description: "Número do processo administrativo vinculado à Nota de Empenho."
      - name: ne_info_complementar
        description: "Informação complementar da Nota de Empenho."
      - name: ne_ccor_descricao
        description: "Descrição do centro de custo/órgão responsável da Nota de Empenho."
      - name: doc_observacao
        description: "Observações registradas no documento orçamentário."
      - name: codigo_gnd
        description: "Código do Grupo de Natureza de Despesa (GND)."
      - name: gnd
        description: "Descrição do Grupo de Natureza de Despesa (GND)."
      - name: natureza_despesa
        description: "Código da natureza de despesa orçamentária."
      - name: natureza_despesa_descricao
        description: "Descrição da natureza de despesa orçamentária."
      - name: codigo_modalidade
        description: "Código da modalidade de aplicação orçamentária."
      - name: modalidade
        description: "Descrição da modalidade de aplicação orçamentária (não confundir com tipo_instrumento, que se refere ao tipo de instrumento de execução)."
      - name: ne_ccor_favorecido
        description: "Código do favorecido registrado na Nota de Empenho."
      - name: ne_ccor_favorecido_descricao
        description: "Nome/descrição do favorecido registrado na Nota de Empenho."
      - name: ne_ccor_ano_emissao
        description: "Ano de emissão da Nota de Empenho."
      - name: ptres
        description: "Código PTRES (Programa de Trabalho Resumido) vinculado ao recurso."
      - name: fonte_recursos_detalhada
        description: "Código da fonte de recursos detalhada."
      - name: fonte_recursos_detalhada_descricao
        description: "Descrição da fonte de recursos detalhada."
      - name: dotacao_inicial
        description: "Valor da dotação orçamentária inicial."
      - name: dotacao_atualizada
        description: "Valor da dotação orçamentária atualizada."
      - name: despesas_empenhadas
        description: "Valor total de despesas empenhadas."
      - name: despesas_liquidadas
        description: "Valor total de despesas liquidadas."
      - name: despesas_pagas
        description: "Valor total de despesas pagas."
      - name: restos_a_pagar_inscritos
        description: "Valor de restos a pagar inscritos."
      - name: restos_a_pagar_pagos
        description: "Valor de restos a pagar já pagos."
      - name: autor_emendas_orcamento
        description: "Código orçamentário da emenda (número da emenda)."
      - name: id_autor
        description: "Identificador do parlamentar autor da emenda. NULL quando o recurso não está vinculado a uma emenda (recurso próprio)."
      - name: cargo_autor
        description: "Cargo do parlamentar autor da emenda (Deputado Federal, Senador, etc.)."
      - name: autor
        description: "Nome do parlamentar autor da emenda."
      - name: partido
        description: "Partido do parlamentar autor da emenda."
      - name: uf_autor
        description: "UF de representação do parlamentar autor da emenda."
      - name: url_foto_autor
        description: "URL da foto do parlamentar autor da emenda."
      - name: email_autor
        description: "E-mail de contato do parlamentar autor da emenda."
      - name: url_foto_partido
        description: "URL do logotipo do partido do parlamentar autor da emenda."
      - name: dt_ingest
        description: "Data/hora de ingestão do registro na camada Silver de origem."
      - name: numero_transferencia
        description: "Número de transferência que identifica o instrumento de execução (convênio ou TED) associado à emenda. Base para a coluna numero_instrumento."
      - name: numero_instrumento
        description: >
          Identificador do instrumento de execução vinculado à emenda:
          nr_convenio (para convênio, termo de fomento e demais modalidades),
          número do TED (num_transf) ou extraído via regex do texto descritivo.
          Pode ser NULL quando a emenda se refere a despesa direta ou ainda não 
          possui instrumento identificado.
      - name: tipo_instrumento
        description: >
          Tipo do instrumento de execução vinculado à emenda (CONVENIO, TED,
          TERMO DE FOMENTO, TERMO DE COLABORACAO, TERMO DE PARCERIA,
          CONTRATO DE REPASSE, etc.), obtido via convenios_consolidados,
          termo_fomento_consolidado, ted_resumo_orcamentario ou inferido via 
          textos descritivos. Pode ser NULL para despesas diretas/contratuais 
          sem instrumento de repasse vinculado.