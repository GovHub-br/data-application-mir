  - name: termo_fomento
    description: >
      Tabela silver enxuta para filtrar e disponibilizar apenas os instrumentos
      do tipo TERMO DE FOMENTO, juntando os dados de convênios consolidados com
      as informações da proposta associada. Essa camada é pensada como base de
      entrada para modelos downstream, sem agregar métricas financeiras.
    meta:
      tags:
        - silver
    columns:
      - name: nr_convenio
        description: "Número do termo de fomento."
      - name: id_proposta
        description: "Identificador único da proposta associada."
